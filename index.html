<style>

  else { for (const r of ERR_RULES) if (r[0].test(probe)) { out.title = r[1]; out.hint = r[2]; out.kind = r[3] || ''; break; } }
  if (!out.title) {
    if (HAS_THAI.test(msg)) { out.title = msg; out.hint = ''; out.raw = ''; }   // ข้อความจากฐานข้อมูล/ห้องเครื่องเป็นไทยและบอกวิธีแก้อยู่แล้ว

  }
  if (HAS_THAI.test(msg) && out.title !== msg) out.raw = msg;   // ข้อความไทยจากระบบ แสดงเป็นรายละเอียดด้วย
  if (ctx) out.title = ctx + ': ' + out.title;

}

function toastErr(title, hint, raw) {

function needField(sel, msg, title = 'ยังบันทึกไม่ได้') {
  document.querySelectorAll('.invalid').forEach(x => x.classList.remove('invalid'));
  const el = typeof sel === 'string' ? $(sel) : sel;

const SupaBackend = () => {
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY);
  const unwrap = r => { if (r.error) { const er = new Error(r.error.message || JSON.stringify(r.error)); er.code = r.error.code; er.status = r.error.status || r.status; er.details = r.error.details; er.hint = r.error.hint; throw er; } return r.data; };
  const readJson = async (r, what) => { let txt = ''; try { txt = await r.text(); return JSON.parse(txt); } catch (_) { const er = new Error(what + ' ตอบกลับไม่ใช่ JSON (HTTP ' + r.status + ')'); er.code = 'BAD_JSON'; er.details = txt.slice(0, 120); throw er; } };
  const applyOpts = (qb, o = {}) => {
    for (const [k, v] of Object.entries(o.eq || {})) qb = qb.eq(k, v);
    for (const [k, v] of Object.entries(o.in || {})) qb = qb.in(k, v);
    if (o.order) qb = qb.order(o.order[0], { ascending: o.order[1] !== false });
    if (o.limit) qb = qb.limit(o.limit);
    return qb;
  };
  return {
    name: 'supabase',
    async session() { return unwrap(await sb.auth.getSession()).session; },
    async login(username, password) {
      const email = username.includes('@') ? username : `${username.trim().toLowerCase()}@${CONFIG.LOGIN_EMAIL_DOMAIN}`;
      unwrap(await sb.auth.signInWithPassword({ email, password }));
      return this.me();
    },
    async logout() { await sb.auth.signOut(); },
    async me() {
      const sess = await this.session(); if (!sess) return null;
      const rows = unwrap(await sb.from('app_user').select('*').eq('id', sess.user.id));
      return rows[0] || null;
    },
    async changePassword(pw) { unwrap(await sb.auth.updateUser({ password: pw })); },
    async list(name, o) { return unwrap(await applyOpts(sb.from(name).select(o?.select || '*'), o)); },
    async rpc(fn, args) { return unwrap(await sb.rpc(fn, args || {})); },   // DEC-114 ฟังก์ชันฐานข้อมูล (public_dashboard เรียกได้โดยไม่ต้องล็อกอิน)
    async insert(table, row) { return unwrap(await sb.from(table).insert(row).select().single()); },
    async insertMany(table, rows) { if (!rows.length) return []; return unwrap(await sb.from(table).insert(rows).select()); },
    async update(table, id, patch, pk = 'id') { return unwrap(await sb.from(table).update(patch).eq(pk, id).select().single()); },
    async remove(table, id) { unwrap(await sb.from(table).delete().eq('id', id)); },
    async engine(action, payload) {
      if (!CONFIG.ENGINE_URL) throw new Error('ยังไม่ได้ตั้งค่า ENGINE_URL (ห้องเครื่อง Apps Script ขั้นที่ 4)');
      const sess = await this.session(); if (!sess) throw new Error('ไม่ได้ล็อกอิน');
      const r = await fetch(CONFIG.ENGINE_URL, { method: 'POST', body: JSON.stringify({ action, token: sess.access_token, ...payload }) });
      const j = await readJson(r, 'ห้องเครื่อง'); if (!j.ok) throw new Error(j.error || 'ห้องเครื่องตอบผิดพลาด'); return j;
    },
    async uploadPhoto(endpointUrl, payload) {
      const url = endpointUrl || CONFIG.ENGINE_URL;
      if (!url) throw new Error('ยังไม่ได้ตั้งค่าที่เก็บรูป (ENGINE_URL หรือสคริปต์รับรูปของเทศบาล)');
      const sess = await this.session(); if (!sess) throw new Error('ไม่ได้ล็อกอิน');
      const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'upload_photo', token: sess.access_token, ...payload }) });
      const j = await readJson(r, 'ตัวรับรูป'); if (!j.ok) throw new Error(j.error || 'ส่งรูปไม่สำเร็จ'); return j;
    }
  };
};

//   รายการ: { id, kind: 'place'|'bin'|'photo', payload, tempId?, placeRef?, status, error, created_at }
//   placeRef = id จริง หรือ tempId ของจุดที่ยังรอส่ง → ตอนส่งจะแปลงเป็น id จริงตามลำดับ
// =====================================================================
const Queue = {
  KEY: 'ubwast_queue_v1',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch { return []; } },
  save(items) { localStorage.setItem(this.KEY, JSON.stringify(items)); this.refreshBadge(); },
  push(item) { const items = this.load(); items.push({ id: 'q' + Date.now() + Math.random().toString(36).slice(2, 6), status: 'pending', created_at: new Date().toISOString(), ...item }); this.save(items); return items[items.length - 1]; },
  remove(id) { this.save(this.load().filter(i => i.id !== id)); },
  bytes() { return (localStorage.getItem(this.KEY) || '').length; },
  refreshBadge() { const n = this.load().length; $('#queueCount').textContent = n; $('#btnQueue').classList.toggle('hidden', n === 0); },
  syncing: false,
  async sync() {
    if (this.syncing || !navigator.onLine) return;
    this.syncing = true;
    const items = this.load(); const idMap = {};
    for (const it of items) {
      if (it.status === 'done') continue;
      try {
        if (it.kind === 'place') { const row = await api.insert('place', it.payload); idMap[it.tempId] = row.id; it.realId = row.id; }
        if (it.kind === 'bin') { const pid = idMap[it.placeRef] || it.placeRef; if (String(pid).startsWith('tmp')) throw new Error('จุดยังไม่ถูกส่ง'); await api.insert('bin', { ...it.payload, place_id: pid }); }
        if (it.kind === 'photo') { const pid = idMap[it.placeRef] || it.placeRef; if (String(pid).startsWith('tmp')) throw new Error('จุดยังไม่ถูกส่ง'); await savePhoto(pid, it.payload); }
        it.status = 'done';
      } catch (e) {
        it.status = 'error'; { const f = friendlyError(e); it.error = f.title + (f.hint ? ' — ' + f.hint : ''); }
        if (isNetworkError(e)) break;   // ไม่มีสัญญาณ หยุดรอรอบหน้า
      }
    }
    this.save(items.filter(i => i.status !== 'done'));
    this.syncing = false;
    if (items.some(i => i.status === 'done')) toast('ส่งข้อมูลที่ค้างแล้ว');
  }
};
window.addEventListener('online', () => Queue.sync());

// แผนที่พื้นหลัง: ใช้ CONFIG.TILES ก่อน ถ้าแผ่นแผนที่โหลดไม่ได้ (เช่น ถูกบล็อก 403) สลับไป TILES_FALLBACK อัตโนมัติ
// หมายเหตุ: OSM ส่งภาพ "Access blocked" มาพร้อมรหัส 403 ซึ่งเบราว์เซอร์ถือว่าโหลดรูปสำเร็จ จึงตรวจด้วย fetch ก่อน ไม่ใช้ tileerror
let _tilesOk = null;   // null = ยังไม่ตรวจ · true/false = ผลตรวจ (จำไว้ตลอดการเปิดหน้า)
const esriKeyDaysLeft = () => CONFIG.ESRI_KEY_EXPIRES ? Math.floor((new Date(CONFIG.ESRI_KEY_EXPIRES + 'T23:59:59+07:00') - Date.now()) / 86400000) : 9999;
async function tilesAvailable() {
  if (_tilesOk !== null) return _tilesOk;
  if (location.protocol === 'file:') return (_tilesOk = false);   // file:// ไม่ส่ง Referer → OSM บล็อกตามนโยบาย
  try { const probe = CONFIG.TILES.url.replace('{z}', '1').replace('{x}', '1').replace('{y}', '0'); const r = await fetch(probe, { referrerPolicy: 'origin' }); _tilesOk = r.ok; }
  catch { _tilesOk = false; }
  return _tilesOk;
}
const ICON = {   // A6 ไอคอน SVG แทนอีโมจิ (เส้น 2px ชุดเดียวกับ ⓘ)
  gps: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="vertical-align:-3px"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>',
  print: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>'
};
const mkMap = id => L.map(id, { zoomAnimation: !window.REDUCED_MOTION_FLAG, fadeAnimation: !window.REDUCED_MOTION_FLAG, markerZoomAnimation: !window.REDUCED_MOTION_FLAG });   // A4
// DEC-096 ซูมเปิดครั้งแรก = กรอบพื้นที่ของเทศบาล (map_bounds) รวมกับจุดทั้งหมด · ไม่มีทั้งคู่ = มุมมองสำรอง
function fitMuni(map, group, muniId) {
  const m = muniOf(muniId || S.scopeMuni) || {}; let b = null;
  if (Array.isArray(m.map_bounds) && m.map_bounds.length === 2) { try { b = L.latLngBounds(m.map_bounds); } catch { b = null; } }
  if (group && group.getLayers && group.getLayers().length) { const gb = group.getBounds(); b = b ? b.extend(gb) : gb; }
  if (b && b.isValid()) map.fitBounds(b.pad(0.05)); else map.setView([CONFIG.MAP_FALLBACK.lat, CONFIG.MAP_FALLBACK.lng], CONFIG.MAP_FALLBACK.zoom);
}
async function saveMapView() {
  if (!S.map || !S.scopeMuni) return toast('เลือกเทศบาลก่อน', true);
  const b = S.map.getBounds(); const mb = [[+b.getSouth().toFixed(5), +b.getWest().toFixed(5)], [+b.getNorth().toFixed(5), +b.getEast().toFixed(5)]];
  if (!confirm('บันทึกมุมมองแผนที่ที่เห็นอยู่ตอนนี้เป็นพื้นที่เริ่มต้นของเทศบาล? (ทุกคนในเทศบาลจะเห็นมุมมองนี้ตอนเปิดแผนที่)')) return;
  try { await api.update('municipality', S.scopeMuni, { map_bounds: mb }); toast('บันทึกพื้นที่เริ่มต้นแล้ว'); S.cache.loaded = false; } catch (e) { fail(e); }
}
async function addBaseLayer(map) {
  const opt = t => ({ maxZoom: t.maxZoom || 19, attribution: t.attribution, referrerPolicy: 'origin', tileSize: t.tileSize || 256, zoomOffset: t.zoomOffset || 0 });
  const useMain = !CONFIG.TILES_FALLBACK || await tilesAvailable();
  const t = useMain ? CONFIG.TILES : CONFIG.TILES_FALLBACK;
  const street = L.tileLayer(t.url, opt(t)); const sat = L.tileLayer(CONFIG.TILES_SATELLITE.url, opt(CONFIG.TILES_SATELLITE));
  // DEC-100 ถ้าภาพจาก Esri โหลดไม่ได้ (คีย์หมดอายุ/ถูกเพิกถอน/เกินโควตา) แจ้งครั้งเดียวต่อการเปิดหน้า ข้อมูลอื่นไม่กระทบ
  const esriFail = () => { if (sessionStorage.getItem('ubwast_esri_fail')) return; sessionStorage.setItem('ubwast_esri_fail', '1'); toastErr('ภาพแผนที่จาก Esri โหลดไม่ได้', `หมุดและข้อมูลยังใช้ได้ตามปกติ สลับกลับไป "แผนที่" ได้ · คีย์ Esri ${esriKeyDaysLeft() < 0 ? 'หมดอายุแล้ว' : 'อาจหมดอายุหรือเกินโควตา'} ให้เจ้าของโครงการต่ออายุที่ location.arcgis.com (กำหนด ${esc(CONFIG.ESRI_KEY_EXPIRES || '-')})`); };
  sat.on('tileerror', esriFail); if (!useMain) street.on('tileerror', esriFail);
  let pref = 'street'; try { pref = localStorage.getItem('ubwast_basemap') || 'street'; } catch {}
  (pref === 'sat' ? sat : street).addTo(map);
  L.control.layers({ 'แผนที่': street, 'ดาวเทียม': sat }, null, { position: 'topright' }).addTo(map);   // DEC-096 ทุกแผนที่สลับดาวเทียมได้ จำตัวเลือกล่าสุด
  map.on('baselayerchange', e => { try { localStorage.setItem('ubwast_basemap', e.name === 'ดาวเทียม' ? 'sat' : 'street'); } catch {} });
  if (!useMain && !sessionStorage.getItem('ubwast_tile_notice')) { sessionStorage.setItem('ubwast_tile_notice', '1'); toast('ใช้แผนที่พื้นหลังสำรอง (แผนที่หลักใช้ได้เมื่อเปิดผ่านเว็บโฮสติ้ง)'); }
}

    const binRows = [...document.querySelectorAll('#binRows .binrow')].map(r => ({ bin_type_id: $('.b_type', r).value, amount: parseInt($('.b_amt', r).value || '0'), color: $('.b_color', r).value || null, condition: $('.b_cond', r).value || 'ปกติ', fiscal_year: $('.b_fy', r).value ? parseInt($('.b_fy', r).value) : null, unit_cost: $('.b_cost', r).value === '' ? null : parseFloat($('.b_cost', r).value), asset_no: $('.b_asset', r).value.trim() || null })).filter(x => x.amount > 0);

      if (Queue.bytes() > CONFIG.QUEUE_WARN_BYTES) toast('คิวพักข้อมูลในเครื่องใกล้เต็ม ควรส่งเมื่อมีสัญญาณโดยเร็ว', true);

    toast('บันทึกจุด ' + row.place_code + ' แล้ว' + (photoPayloads.length ? ' · กำลังส่งรูปต่อเบื้องหลัง' : ''));

    if (photoPayloads.length) uploadPhotosInBackground(row.id, photoPayloads, name);
  } catch (e) { fail(e, id ? 'บันทึกจุดไม่สำเร็จ' : 'เพิ่มจุดไม่สำเร็จ'); } finally { b.disabled = false; b.textContent = btnText; }
}

// ---- รูป ----
async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const scale = Math.min(1, CONFIG.PHOTO_MAX_PX / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', CONFIG.PHOTO_QUALITY); URL.revokeObjectURL(img.src);
  return { mime: 'image/jpeg', data: dataUrl.split(',')[1], filename: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' };
}
async function savePhoto(placeId, ph) {
  const [p] = await api.list('place', { eq: { id: placeId } });
  const muni = muniOf(p.municipality_id);
  const endpoint = muni.photo_endpoint_url || setting('default_photo_endpoint_url') || '';
  const existing = await api.list('place_photo', { eq: { place_id: placeId, status: 'active' } });
  if (existing.length >= maxPhotos()) throw new Error(`จุดนี้มีรูปครบ ${maxPhotos()} รูปแล้ว`);   // ตรวจก่อนส่งรูป (ฐานข้อมูลตรวจซ้ำอีกชั้น)
  const up = await api.uploadPhoto(endpoint, { ...ph, municipality_code: muni.code, place_code: p.place_code, filename: `${p.place_code}_${Date.now()}.jpg` });
  const row = await api.insert('place_photo', { place_id: placeId, seq: existing.length + 1, storage_kind: 'gdrive', file_id: up.file_id, url: up.url, taken_at: new Date().toISOString() });
  row._size = up.size; return row;
}
async function addPhoto(placeId, file) {
  if (!file) return; toast('กำลังย่อและส่งรูป…');
  try { const ph = await compressImage(file); try { const row = await savePhoto(placeId, ph); toast('เพิ่มรูปแล้ว' + (row._size ? ` (${Math.round(row._size / 1024)} KB)` : '')); } catch (e) { if (!isNetworkError(e)) throw e; Queue.push({ kind: 'photo', placeRef: placeId, payload: ph, label: 'รูป (เพิ่มภายหลัง)' }); toast('ไม่มีสัญญาณ เก็บรูปไว้ส่งภายหลัง'); } render(); } catch (e) { fail(e); }
}

// DEC-118 ช่วยคนขับ: ปุ่มวันนี้/เมื่อวาน · เลือกรอบถัดไปให้เอง · แสดงน้ำหนักเป็น กก. และระยะทางจากเลขไมล์ทันที
function tpDay(d) { const x = new Date(); x.setDate(x.getDate() + d); $('#tp_date').value = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; tpAuto(); }
function tpAuto() {
  if (S._tripEdit || !$('#tp_round')) return;

    <div id="dashBody"></div>`;
  const charts = []; S._page = 0;
  const draw = () => {
    S.dash.road = pickValues('pk_road'); S.dash.type = pickValues('pk_type'); S.dash.ptype = pickValues('pk_ptype');
    const fr = new Set(S.dash.road), ft = new Set(S.dash.type), fp = new Set(S.dash.ptype);
    let ps = places.filter(p => (!fr.size || fr.has(p.road_id)) && (!fp.size || fp.has(p.place_type_id)));
    const pid = new Set(ps.map(p => p.id));
    const bs = bins.filter(b => pid.has(b.place_id) && (!ft.size || ft.has(b.bin_type_id)));
    if (ft.size) { const has = new Set(bs.map(b => b.place_id)); ps = ps.filter(p => has.has(p.id)); }   // กรองประเภทถัง → นับเฉพาะจุดที่มีถังประเภทนั้น และนับลิตรเฉพาะประเภทนั้น
    const agg = {}; for (const b of bs) { agg[b.place_id] = agg[b.place_id] || { bins: 0, liters: 0 }; agg[b.place_id].bins += +b.amount; agg[b.place_id].liters += +b.liters; }
    const rows = ps.map(p => ({ ...p, f_bins: (agg[p.id] || {}).bins || 0, f_liters: (agg[p.id] || {}).liters || 0 })).sort((a, b) => b.f_liters - a.f_liters);
    const totL = sum(rows, 'f_liters'), totB = sum(rows, 'f_bins'); const tiers = tiersSorted();

    let cum = 0, heavy = 0; for (const r of roadArr) { if (cum < totL / 2) heavy++; cum += r.liters; }   // ถนนกลุ่มแรกที่รวมกันถือความจุเกินครึ่ง (ไม่ฟิกตัวเลขลิตร)
    // Pareto
    let c2 = 0; const cumPts = rows.map((r, i) => { c2 += r.f_liters; return { x: i + 1, y: pct(c2, totL) }; });
    const half = cumPts.findIndex(p => p.y > 50) + 1; const topTier = tiers[tiers.length - 1]; const nTop = rows.filter(r => r.tier_label === topTier.label).length;

    const typeAgg = {}; for (const b of bs) { typeAgg[b.bin_type_name] = typeAgg[b.bin_type_name] || { name: b.bin_type_name, bins: 0, liters: 0 }; typeAgg[b.bin_type_name].bins += +b.amount; typeAgg[b.bin_type_name].liters += +b.liters; }

function exportCsv(rows, name) {

const ROUTE_RAMP = ['#9ccc65', '#ffca28', '#fb8c00', '#e53935', '#6a1b9a'];   // น้อย → มาก (เขียวอ่อน เหลือง ส้ม แดง ม่วง ชุดเดียวกับระดับจุด)

  const bandOf = v => (step === 0 ? ROUTE_RAMP.length - 1 : Math.min(ROUTE_RAMP.length - 1, Math.floor(((+v || 0) - lo) / step)));
  const legend = ROUTE_RAMP.map((c, i) => ({ color: c, from: Math.round(lo + step * i), to: i === ROUTE_RAMP.length - 1 ? Math.round(hi) : Math.round(lo + step * (i + 1)) }));

}

function fuelCalc() {

async function saveFuel(ym) {
  const b = $('#btnFuel'); let done = 0;

    for (const [k, sel] of [['fuel_qty', '.fq'], ['cost_baht', '.fc'], ['odo_start', '.o1'], ['odo_end', '.o2']]) if (rec[k] != null && (isNaN(rec[k]) || rec[k] < 0)) return needField($(sel, tr), 'ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป');

async function saveSetting(key) {

  v = String(v).trim();
  if (m.type === 'number' && v !== '' && isNaN(parseFloat(v))) return needField('#st_' + key, 'ค่านี้ต้องเป็นตัวเลขเท่านั้น');

}

const PHOTO_SCRIPT_TEMPLATE = "/**\n * UBWast — สคริปต์รับรูป \"ฉบับย่อ\" สำหรับเทศบาลที่ต้องการเก็บรูปใน Google Drive ของตนเอง (DEC-080 วิธี ข · DEC-095)\n * ----------------------------------------------------------------------\n * วิธีใช้ (เทศบาลทำเอง ไม่ต้องตั้งค่าใด ๆ เพิ่ม):\n *   1. เข้า script.google.com ด้วยบัญชี Google ของเทศบาล → โครงการใหม่ (New project)\n *   2. ลบโค้ดเดิมในไฟล์ รหัส.gs (Code.gs) ให้ว่าง แล้ววางไฟล์นี้ทั้งหมด → บันทึก (Save)\n *   3. การทำให้ใช้งานได้ (Deploy) → การทำให้ใช้งานได้ใหม่ (New deployment) → ประเภท เว็บแอป (Web app)\n *      · ดำเนินการในฐานะ ฉัน (Execute as: Me) · ผู้มีสิทธิ์เข้าถึง ทุกคน (Who has access: Anyone) → ทำให้ใช้งานได้ (Deploy) → อนุญาต (Authorize)\n *   4. คัดลอก URL เว็บแอป (ลงท้าย /exec) ส่งให้ admin เทศบาล หรือเจ้าของโครงการ ไปใส่ในหน้า \"ตั้งค่าเทศบาล\"\n *\n * ค่า 2 ค่าด้านล่างเป็นค่าสาธารณะของโครงการ (เหมือนกันทุกเทศบาล · เจ้าของโครงการเติมให้แล้ว · ไม่ใช่ความลับ)\n * ไม่มีกุญแจลับใด ๆ ในสคริปต์นี้ · รับเฉพาะรูปจากผู้ที่ล็อกอินระบบ UBWast จริงเท่านั้น\n * รูปจะอยู่ในโฟลเดอร์ \"UBWast-photos/<รหัสเทศบาล>\" ใน Drive ของบัญชีที่ deploy (สร้างให้อัตโนมัติ)\n * ถ้าต้องการใช้โฟลเดอร์ที่สร้างเองให้ใส่รหัสโฟลเดอร์ใน PHOTO_FOLDER_ID (ไม่บังคับ)\n */\nvar SUPABASE_URL = '__SUPABASE_URL__';              // ที่อยู่ฐานข้อมูลของโครงการ\nvar SUPABASE_PUBLISHABLE_KEY = '__SUPABASE_KEY__';  // กุญแจสาธารณะ (sb_publishable_…) ค่าเดียวกับในหน้าเว็บ\nvar PHOTO_FOLDER_ID = '';                           // ไม่บังคับ: รหัสโฟลเดอร์ Drive (ตัวอักษรท้ายลิงก์โฟลเดอร์) ว่าง = สร้าง \"UBWast-photos\" ให้เอง\n\nvar VERSION = '0.2.0';\n// อ่านค่า: ใช้ค่าคงที่ด้านบนก่อน ถ้าว่างค่อยอ่านจาก Script properties (รองรับวิธีเดิม)\nfunction cfg_(key) { var c = { SUPABASE_URL: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY: SUPABASE_PUBLISHABLE_KEY, PHOTO_FOLDER_ID: PHOTO_FOLDER_ID }[key]; if (c && !/^__/.test(c)) return c; return PropertiesService.getScriptProperties().getProperty(key) || ''; }\n\n\nfunction doGet() { return json_({ ok: true, service: 'ubwast-photo-upload', version: VERSION }); }\n\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'คำขอไม่ใช่ JSON' }); }\n  try {\n    if (req.action !== 'upload_photo') return json_({ ok: false, error: 'สคริปต์นี้รับเฉพาะ upload_photo' });\n    verifyLogin_(req.token);\n    if (!req.data) throw new Error('ไม่มีข้อมูลรูป');\n    var root = folderByProp_('PHOTO_FOLDER_ID', 'UBWast-photos');\n    var sub = subFolder_(root, String(req.municipality_code || 'misc'));\n    var name = req.filename || (String(req.place_code || 'photo') + '_' + Utilities.formatDate(new Date(), 'Asia/Bangkok', 'yyyyMMdd_HHmmss') + '.jpg');\n    var blob = Utilities.newBlob(Utilities.base64Decode(req.data), req.mime || 'image/jpeg', name);\n    var file = sub.createFile(blob);\n    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n    return json_({ ok: true, file_id: file.getId(),\n                   url: 'https://drive.google.com/thumbnail?id=' + file.getId() + '&sz=w1000',\n                   view_url: 'https://drive.google.com/file/d/' + file.getId() + '/view',\n                   size: blob.getBytes().length });\n  } catch (err) {\n    return json_({ ok: false, error: String(err && err.message || err) });\n  }\n}\n\nfunction verifyLogin_(token) {\n  if (!token) throw new Error('ไม่ได้ล็อกอิน');\n  if (!cfg_('SUPABASE_URL') || !cfg_('SUPABASE_PUBLISHABLE_KEY')) throw new Error('สคริปต์ยังไม่มีค่า SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY (ขอสคริปต์ที่เติมค่าแล้วจากเจ้าของโครงการ)');\n  var res = UrlFetchApp.fetch(cfg_('SUPABASE_URL') + '/auth/v1/user', {\n    method: 'get', muteHttpExceptions: true,\n    headers: { apikey: cfg_('SUPABASE_PUBLISHABLE_KEY'), Authorization: 'Bearer ' + token }\n  });\n  if (res.getResponseCode() !== 200) throw new Error('ตัวตนไม่ถูกต้องหรือหมดอายุ กรุณาล็อกอินใหม่');\n}\nfunction folderByProp_(propKey, defaultName) {\n  var id = cfg_(propKey);\n  if (id) return DriveApp.getFolderById(id);\n  var it = DriveApp.getFoldersByName(defaultName);\n  var f = it.hasNext() ? it.next() : DriveApp.createFolder(defaultName);\n  PropertiesService.getScriptProperties().setProperty(propKey, f.getId());   // จำโฟลเดอร์ที่สร้างไว้ ครั้งต่อไปใช้เดิม\n  return f;\n}\nfunction subFolder_(parent, name) {\n  var it = parent.getFoldersByName(name);\n  return it.hasNext() ? it.next() : parent.createFolder(name);\n}\nfunction json_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }\n";

// DEC-096 ดึงถนน/ซอยจาก OpenStreetMap เฉพาะเทศบาลที่ระบุ (ขอบเขต relation หรือกรอบแผนที่) · กติกาเดียวกับ scripts/gen_roads_osm.py

const OSM_TYPE = { motorway: 'สายหลัก', trunk: 'สายหลัก', primary: 'สายหลัก', secondary: 'สายรอง', tertiary: 'สายรอง', residential: 'ถนนย่อย', unclassified: 'ถนนย่อย', living_street: 'ถนนย่อย', service: 'ถนนย่อย' };
const OSM_SKIP = new Set(['footway', 'path', 'steps', 'cycleway', 'track', 'pedestrian', 'bridleway', 'construction', 'proposed']);
const RANK = { 'สายหลัก': 0, 'สายรอง': 1, 'ถนนย่อย': 2, 'ซอย': 3 };
const normName = v => String(v || '').replace(/\s+/g, ' ').trim().replace(/^(ถนน|ถ\.)\s*/, '').trim();
async function overpass(query) {
  let last = null;
  for (const url of CONFIG.OVERPASS_URLS) { try { const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query) }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } catch (e) { last = e; } }
  throw new Error('บริการแผนที่ OpenStreetMap ไม่ตอบในขณะนี้ ลองใหม่ภายหลัง (' + (last && last.message) + ')');
}
function osmToRoads(elements) {
  const names = {};
  for (const w of elements) { const t = w.tags || {}; let name = normName(t['name:th'] || t.name || ''); if (!name || /^[A-Za-z0-9 .\-\/]+$/.test(name) || OSM_SKIP.has(t.highway)) continue;
    let kind = OSM_TYPE[t.highway] || 'ถนนย่อย'; if (name.startsWith('ซอย') || name.includes(' ซอย')) kind = 'ซอย';
    if (!(name in names) || RANK[kind] < RANK[names[name]]) names[name] = kind; }
  const roads = Object.entries(names).filter(([, k]) => k !== 'ซอย').map(([name, kind]) => ({ name, kind }));
  const roadNames = roads.map(r => r.name).sort((a, b) => b.length - a.length);
  const sois = [], orphans = [];
  for (const [name, kind] of Object.entries(names)) { if (kind !== 'ซอย') continue; const m = name.match(/^ซอย\s*(.+?)\s*(\d+[\/\d]*)?$/) || name.match(/^(.+?)\s+ซอย\s*(\d+[\/\d]*)?$/); let parent = null;
    if (m) { const base = normName(m[1]); parent = roadNames.find(rn => base === rn || (rn.length >= 3 && base.startsWith(rn))) || null; }
    if (parent) sois.push({ parent, name }); else orphans.push({ name, kind: 'ซอย' }); }
  return { roads: roads.concat(orphans).sort((a, b) => RANK[a.kind] - RANK[b.kind] || a.name.localeCompare(b.name, 'th')), sois };
}
// นำเข้าให้เทศบาล: ข้ามชื่อที่มีอยู่แล้ว (เทียบแบบตัดช่องว่าง/คำว่า ถนน) · คืนสรุปจำนวน
async function importRoadsOSM(mid, src, onProgress) {
  const say = t => { if (onProgress) onProgress(t); };
  const q = src.relationId ? `[out:json][timeout:120];area(${3600000000 + Number(src.relationId)})->.a;way(area.a)["highway"]["name"];out tags;`
                           : `[out:json][timeout:120];way(${src.bounds[0][0]},${src.bounds[0][1]},${src.bounds[1][0]},${src.bounds[1][1]})["highway"]["name"];out tags;`;
  say('กำลังดึงถนนจาก OpenStreetMap…'); const data = await overpass(q);
  const { roads, sois } = osmToRoads(data.elements || []);
  const existing = await api.list('road', { eq: { municipality_id: mid } }); const have = new Set(existing.map(r => normName(r.name).toLowerCase()));
  const newRoads = roads.filter(r => !have.has(r.name.toLowerCase()));
  say(`พบถนน ${roads.length} สาย ใหม่ ${newRoads.length} สาย กำลังบันทึก…`);
  const inserted = await api.insertMany('road', newRoads.map(r => ({ municipality_id: mid, name: r.name, road_type: r.kind })));
  const allRoads = existing.concat(inserted); const byName = {}; for (const r of allRoads) byName[normName(r.name).toLowerCase()] = r;
  const existingSoi = await api.list('soi', { eq: { municipality_id: mid } }); const haveSoi = new Set(existingSoi.map(x => x.road_id + '|' + normName(x.name).toLowerCase()));
  const newSois = sois.map(x => ({ road: byName[x.parent.toLowerCase()], name: x.name })).filter(x => x.road && !haveSoi.has(x.road.id + '|' + x.name.toLowerCase()));
  await api.insertMany('soi', newSois.map(x => ({ municipality_id: mid, road_id: x.road.id, name: x.name })));
  return { found: roads.length, roadsAdded: inserted.length, soisAdded: newSois.length, skipped: roads.length - newRoads.length };
}

// เอกสารพิมพ์ทุกฉบับ: เครดิตท้ายทุกหน้ากระดาษ (ตำแหน่ง fixed ตอนพิมพ์ + ตารางห่อ tfoot เว้นที่ด้านล่างทุกหน้าไม่ให้ทับเนื้อหา)
const PRINT_CREDIT_CSS = '.pgwrap{width:100%;border-collapse:collapse;border:0;margin:0}.pgwrap>thead>tr>td,.pgwrap>tbody>tr>td,.pgwrap>tfoot>tr>td{border:0;padding:0}.pgcredit{margin-top:14px;text-align:center;font-size:9pt;color:#555;border-top:1px solid #ccc;padding-top:3px}@media print{.pgcredit{position:fixed;bottom:0;left:0;right:0;margin:0;background:#fff}}';
function withCredit(doc) {
  const credit = `<div class="pgcredit">${esc(CREDIT.short)} · ${esc(CREDIT.url)}</div>`;
  return doc.replace('</style>', PRINT_CREDIT_CSS + '</style>')
    .replace(/<body([^>]*)>/, '<body$1><table class="pgwrap"><tfoot><tr><td><div style="height:12mm"></div></td></tr></tfoot><tbody><tr><td>')
    .replace(/<\/body>(?![\s\S]*<\/body>)/, '</td></tr></tbody></table>' + credit + '</body>');
}

    document.body.append(box, dot);

<script>
// =====================================================================
// สถานะรวมของแอป
// =====================================================================
const S = {
  me: null,           // โปรไฟล์ app_user ของผู้ล็อกอิน
  scopeMuni: null,    // เทศบาลที่กำลังดู (super admin เลือกได้ · คนอื่น = เทศบาลตน)
  munis: [],          // เทศบาลที่มองเห็น
  cache: {},          // ตารางแม่ที่โหลดแล้ว
  map: null, markers: null,
  charts: []
};
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n == null ? '-' : Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 }));
const thDate = iso => iso ? new Date(iso).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
const IS_DEMO = CONFIG.DEMO || /[?&]demo=1/.test(location.search);

function toast(msg, isErr) {
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  $('#toastHost').appendChild(t); setTimeout(() => t.remove(), isErr ? 5000 : 2500);
}
function go(hash) { location.hash = hash; }
function isNetworkError(e) { return !navigator.onLine || /fetch|network|Failed|load failed|timeout/i.test(String(e && (e.message || e))); }

// =====================================================================
// ชั้นข้อมูล A: Supabase จริง
// =====================================================================
const SupaBackend = () => {
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY);
  const unwrap = r => { if (r.error) throw new Error(r.error.message || JSON.stringify(r.error)); return r.data; };
  const applyOpts = (qb, o = {}) => {
    for (const [k, v] of Object.entries(o.eq || {})) qb = qb.eq(k, v);
    for (const [k, v] of Object.entries(o.in || {})) qb = qb.in(k, v);
    if (o.order) qb = qb.order(o.order[0], { ascending: o.order[1] !== false });
    if (o.limit) qb = qb.limit(o.limit);
    return qb;
  };
  return {
    name: 'supabase',
    async session() { return unwrap(await sb.auth.getSession()).session; },
    async login(username, password) {
      const email = username.includes('@') ? username : `${username.trim().toLowerCase()}@${CONFIG.LOGIN_EMAIL_DOMAIN}`;
      unwrap(await sb.auth.signInWithPassword({ email, password }));
      return this.me();
    },
    async logout() { await sb.auth.signOut(); },
    async me() {
      const sess = await this.session(); if (!sess) return null;
      const rows = unwrap(await sb.from('app_user').select('*').eq('id', sess.user.id));
      return rows[0] || null;
    },
    async changePassword(pw) { unwrap(await sb.auth.updateUser({ password: pw })); },
    async list(name, o) { return unwrap(await applyOpts(sb.from(name).select(o?.select || '*'), o)); },
    async insert(table, row) { return unwrap(await sb.from(table).insert(row).select().single()); },
    async update(table, id, patch, pk = 'id') { return unwrap(await sb.from(table).update(patch).eq(pk, id).select().single()); },
    async remove(table, id) { unwrap(await sb.from(table).delete().eq('id', id)); },
    async engine(action, payload) {
      if (!CONFIG.ENGINE_URL) throw new Error('ยังไม่ได้ตั้งค่า ENGINE_URL (ห้องเครื่อง Apps Script ขั้นที่ 4)');
      const sess = await this.session(); if (!sess) throw new Error('ไม่ได้ล็อกอิน');
      const r = await fetch(CONFIG.ENGINE_URL, { method: 'POST', body: JSON.stringify({ action, token: sess.access_token, ...payload }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ห้องเครื่องตอบผิดพลาด'); return j;
    },
    async uploadPhoto(endpointUrl, payload) {
      const url = endpointUrl || CONFIG.ENGINE_URL;
      if (!url) throw new Error('ยังไม่ได้ตั้งค่าที่เก็บรูป (ENGINE_URL หรือสคริปต์รับรูปของเทศบาล)');
      const sess = await this.session();
      const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'upload_photo', token: sess.access_token, ...payload }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ส่งรูปไม่สำเร็จ'); return j;
    }
  };
};

// =====================================================================
// ชั้นข้อมูล B: โหมดสาธิต (ข้อมูลตัวอย่างในหน่วยความจำ เลียนแบบ RLS และ view)
// =====================================================================
const DemoBackend = () => {
  const uid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  const now = () => new Date().toISOString();
  const D = { municipality: [], app_user: [], bin_type: [], truck_type: [], place_type: [], capacity_tier: [], app_setting: [],
              road: [], soi: [], truck: [], route: [], route_road: [], place: [], bin: [], place_photo: [] };
  const add = (t, row) => { const r = { id: uid(), status: 'active', created_at: now(), updated_at: now(), ...row }; D[t].push(r); return r; };
  // --- ข้อมูลตัวอย่าง (เหมือน sql/020_sample_data.sql) ---
  const m1 = add('municipality', { code: 'DEMO1', name: 'เทศบาลตัวอย่าง หนึ่ง', max_recorders: 3, photo_endpoint_url: '' });
  const m2 = add('municipality', { code: 'DEMO2', name: 'เทศบาลตัวอย่าง สอง', max_recorders: 3, photo_endpoint_url: '' });
  const users = [
    add('app_user', { username: 'owner', display_name: 'เจ้าของโครงการ (สาธิต)', role: 'super_admin', municipality_id: null }),
    add('app_user', { username: 'demo1-admin', display_name: 'admin เทศบาลหนึ่ง', role: 'admin', municipality_id: m1.id }),
    add('app_user', { username: 'demo1-rec1', display_name: 'ผู้บันทึก หนึ่ง', role: 'recorder', municipality_id: m1.id }),
    add('app_user', { username: 'demo2-admin', display_name: 'admin เทศบาลสอง', role: 'admin', municipality_id: m2.id }),
    add('app_user', { username: 'demo2-rec1', display_name: 'ผู้บันทึก สอง', role: 'recorder', municipality_id: m2.id })
  ];
  const bt120 = add('bin_type', { name: 'ตัวอย่าง ถัง 120 ลิตร', liters: 120, color: 'เขียว', sort_order: 1, unit_cost: 1000, useful_life_years: 5 });
  const bt240 = add('bin_type', { name: 'ตัวอย่าง ถัง 240 ลิตร', liters: 240, color: 'น้ำเงิน', sort_order: 2, unit_cost: 2000, useful_life_years: 5 });
  const bt4000 = add('bin_type', { name: 'ตัวอย่าง คอนเทนเนอร์ 4,000 ลิตร', liters: 4000, color: 'เหลือง', sort_order: 3, unit_cost: 70000, useful_life_years: 10 });
  const bt200 = add('bin_type', { name: 'ตัวอย่าง ถังเหล็ก 200 ลิตร (ยังไม่กำหนดราคา)', liters: 200, color: 'ดำ', sort_order: 4, unit_cost: 0, useful_life_years: 0 });
  const tt = add('truck_type', { name: 'ตัวอย่าง รถอัดท้าย 6 ลบ.ม.', capacity_liters: 6000, sort_order: 1 });
  add('truck_type', { name: 'ตัวอย่าง รถอัดท้าย 12 ลบ.ม.', capacity_liters: 12000, sort_order: 2 });
  const pt = add('place_type', { name: 'จุดทิ้งขยะ', sort_order: 1 }); add('place_type', { name: 'ตลาด', sort_order: 2 }); add('place_type', { name: 'ร้านค้า', sort_order: 3 });
  [['≤120 ลิตร', 0, 120, '#2E7D32'], ['121–240 ลิตร', 120.01, 240, '#F9A825'], ['241–480 ลิตร', 240.01, 480, '#EF6C00'], ['481–1,000 ลิตร', 480.01, 1000, '#C62828'], ['>1,000 ลิตร', 1000.01, null, '#6A1B9A']]
    .forEach((t, i) => add('capacity_tier', { label: t[0], min_liters: t[1], max_liters: t[2], color: t[3], sort_order: i + 1 }));
  D.app_setting.push({ key: 'kg_per_liter', value: '', description: 'ตัวคูณแปลงลิตรเป็นกิโลกรัม' }, { key: 'default_photo_endpoint_url', value: '', description: 'ลิงก์สคริปต์รับรูปค่ากลาง' }, { key: 'system_name', value: 'ระบบข้อมูลจุดวางถังขยะ (สาธิต)', description: 'ชื่อระบบ' }, { key: 'max_photos_per_place', value: '3', description: 'จำนวนรูปสูงสุดต่อจุด' }, { key: 'bin_colors', value: 'น้ำเงิน,เขียว,เหลือง,แดง,ดำ', description: 'รายการสีถังให้เลือก' }, { key: 'asset_prices_status', value: 'ประมาณการ', description: 'สถานะราคามาตรฐานถัง' });

  const r4 = add('road', { municipality_id: m2.id, name: 'ถนนตัวอย่าง ง', road_type: 'สายหลัก' });
  const s1 = add('soi', { municipality_id: m1.id, road_id: r1.id, name: 'ซอย 1' });
  const t1 = add('truck', { municipality_id: m1.id, truck_type_id: tt.id, code: 'รถ 01', plate_no: 'ตัวอย่าง-1', capacity_liters: null });

// คิวพักข้อมูลในเครื่อง (ข้อกำหนดบังคับ: ทำงานตอนสัญญาณอ่อน)
//   รายการ: { id, kind: 'place'|'bin'|'photo', payload, tempId?, placeRef?, status, error, created_at }
//   placeRef = id จริง หรือ tempId ของจุดที่ยังรอส่ง → ตอนส่งจะแปลงเป็น id จริงตามลำดับ
// =====================================================================
const Queue = {
  KEY: 'ubwast_queue_v1',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch { return []; } },
  save(items) { localStorage.setItem(this.KEY, JSON.stringify(items)); this.refreshBadge(); },
  push(item) { const items = this.load(); items.push({ id: 'q' + Date.now() + Math.random().toString(36).slice(2, 6), status: 'pending', created_at: new Date().toISOString(), ...item }); this.save(items); return items[items.length - 1]; },
  remove(id) { this.save(this.load().filter(i => i.id !== id)); },
  bytes() { return (localStorage.getItem(this.KEY) || '').length; },
  refreshBadge() { const n = this.load().length; $('#queueCount').textContent = n; $('#btnQueue').classList.toggle('hidden', n === 0); },
  syncing: false,
  async sync() {
    if (this.syncing || !navigator.onLine) return;
    this.syncing = true;
    const items = this.load(); const idMap = {};
    for (const it of items) {
      if (it.status === 'done') continue;
      try {
        if (it.kind === 'place') { const row = await api.insert('place', it.payload); idMap[it.tempId] = row.id; it.realId = row.id; }
        if (it.kind === 'bin') { const pid = idMap[it.placeRef] || it.placeRef; if (String(pid).startsWith('tmp')) throw new Error('จุดยังไม่ถูกส่ง'); await api.insert('bin', { ...it.payload, place_id: pid }); }
        if (it.kind === 'photo') { const pid = idMap[it.placeRef] || it.placeRef; if (String(pid).startsWith('tmp')) throw new Error('จุดยังไม่ถูกส่ง'); await savePhoto(pid, it.payload); }
        it.status = 'done';
      } catch (e) {
        it.status = 'error'; it.error = String(e.message || e);
        if (isNetworkError(e)) break;   // ไม่มีสัญญาณ หยุดรอรอบหน้า
      }
    }
    this.save(items.filter(i => i.status !== 'done'));
    this.syncing = false;
    if (items.some(i => i.status === 'done')) toast('ส่งข้อมูลที่ค้างแล้ว');
  }
};
window.addEventListener('online', () => Queue.sync());

// แผนที่พื้นหลัง: ใช้ CONFIG.TILES ก่อน ถ้าแผ่นแผนที่โหลดไม่ได้ (เช่น ถูกบล็อก 403) สลับไป TILES_FALLBACK อัตโนมัติ
// หมายเหตุ: OSM ส่งภาพ "Access blocked" มาพร้อมรหัส 403 ซึ่งเบราว์เซอร์ถือว่าโหลดรูปสำเร็จ จึงตรวจด้วย fetch ก่อน ไม่ใช้ tileerror
let _tilesOk = null;   // null = ยังไม่ตรวจ · true/false = ผลตรวจ (จำไว้ตลอดการเปิดหน้า)
async function tilesAvailable() {
  if (_tilesOk !== null) return _tilesOk;
  if (location.protocol === 'file:') return (_tilesOk = false);   // file:// ไม่ส่ง Referer → OSM บล็อกตามนโยบาย
  try { const probe = CONFIG.TILES.url.replace('{z}', '1').replace('{x}', '1').replace('{y}', '0'); const r = await fetch(probe, { referrerPolicy: 'origin' }); _tilesOk = r.ok; }
  catch { _tilesOk = false; }
  return _tilesOk;
}
async function addBaseLayer(map) {
  const opt = t => ({ maxZoom: t.maxZoom || 19, attribution: t.attribution, referrerPolicy: 'origin' });
  const useMain = !CONFIG.TILES_FALLBACK || await tilesAvailable();
  const t = useMain ? CONFIG.TILES : CONFIG.TILES_FALLBACK;
  L.tileLayer(t.url, opt(t)).addTo(map);
  if (!useMain && !sessionStorage.getItem('ubwast_tile_notice')) { sessionStorage.setItem('ubwast_tile_notice', '1'); toast('ใช้แผนที่พื้นหลังสำรอง (แผนที่หลักใช้ได้เมื่อเปิดผ่านเว็บโฮสติ้ง)'); }
}

const binColorSelect = (cls, current) => { let list = (setting('bin_colors') || '').split(',').map(s => s.trim()).filter(Boolean); if (!list.length) list = ['น้ำเงิน', 'เขียว', 'เหลือง', 'แดง', 'ดำ'];   // สำรองเมื่อยังไม่ได้ตั้งค่า bin_colors
  if (current && !list.includes(current)) list.push(current);
  return `<select class="${cls}"><option value="">ตามประเภท/ไม่ระบุ</option>${list.map(c => `<option value="${esc(c)}" ${c === current ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`; };
// ปีงบประมาณไทย (พ.ศ.) 1 ต.ค.–30 ก.ย. · สภาพถัง (DEC-089: ชำรุด/หาย ไม่นับความจุ)
const currentFY = () => { const d = new Date(); return d.getFullYear() + 543 + (d.getMonth() >= 9 ? 1 : 0); };
const CONDITIONS = ['ปกติ', 'ชำรุด', 'หาย'];
const fySelect = (cls, current) => { const fy = currentFY(); const cur = current ? +current : null; let opts = ''; if (cur && (cur > fy || cur < fy - 30)) opts += `<option value="${cur}" selected>${cur}</option>`; for (let y = fy; y >= fy - 30; y--) opts += `<option value="${y}" ${cur === y ? 'selected' : ''}>${y}</option>`; return `<select class="${cls}"><option value="">ไม่ทราบปี</option>${opts}</select>`; };
const condSelect = (cls, current) => `<select class="${cls}">${CONDITIONS.map(c => `<option value="${c}" ${c === (current || 'ปกติ') ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
const condPill = c => c && c !== 'ปกติ' ? ` <span class="pill" style="background:${c === 'หาย' ? '#fee2e2' : '#ffedd5'}">${esc(c)} · ไม่นับความจุ</span>` : '';

async function savePlace(id) {

  const lat = $('#f_lat').value === '' ? null : parseFloat($('#f_lat').value), lng = $('#f_lng').value === '' ? null : parseFloat($('#f_lng').value);
  if ((lat == null) !== (lng == null)) return toast('กรอกพิกัดให้ครบทั้งสองค่า หรือเว้นว่างทั้งคู่', true);
  const payload = { name, place_type_id: $('#f_type').value || null, road_id: $('#f_road').value, soi_id: $('#f_soi').value || null, lat, lng, note: $('#f_note').value.trim() || null };
  if (!S.me.municipality_id) payload.municipality_id = S.scopeMuni;   // super admin ต้องระบุเทศบาล
  const b = $('#btnSave'); b.disabled = true; const btnText = b.textContent; b.textContent = 'กำลังบันทึก…';
  try {
    if (id) { await api.update('place', id, payload); toast('บันทึกแล้ว'); go('#place/' + id); return; }
    const code = $('#f_code').value.trim(); if (code) payload.place_code = code;
    const binRows = [...document.querySelectorAll('#binRows .binrow')].map(r => ({ bin_type_id: $('.b_type', r).value, amount: parseInt($('.b_amt', r).value || '0'), color: $('.b_color', r).value || null, condition: $('.b_cond', r).value || 'ปกติ', fiscal_year: $('.b_fy', r).value ? parseInt($('.b_fy', r).value) : null, unit_cost: $('.b_cost', r).value === '' ? null : parseFloat($('.b_cost', r).value), asset_no: $('.b_asset', r).value.trim() || null })).filter(x => x.amount > 0);
    const files = [...($('#f_photos').files || [])].slice(0, maxPhotos());
    if (files.length) toast(`กำลังย่อรูป ${files.length} รูป…`);
    const photoPayloads = []; for (const f of files) photoPayloads.push(await compressImage(f));
    const queueAll = (why) => {
      const tempId = 'tmp' + Date.now();
      Queue.push({ kind: 'place', tempId, payload, label: `${name} (${why})` });
      binRows.forEach(x => Queue.push({ kind: 'bin', placeRef: tempId, payload: x, label: 'ถังของ ' + name }));
      photoPayloads.forEach(ph => Queue.push({ kind: 'photo', placeRef: tempId, payload: ph, label: 'รูปของ ' + name }));
      if (Queue.bytes() > CONFIG.QUEUE_WARN_BYTES) toast('คิวพักข้อมูลในเครื่องใกล้เต็ม ควรส่งเมื่อมีสัญญาณโดยเร็ว', true);
      toast('เก็บไว้ในเครื่องแล้ว จะส่งเมื่อมีสัญญาณ'); go('#places');
    };
    if (!navigator.onLine) return queueAll('ไม่มีสัญญาณ');
    let row;
    try { row = await api.insert('place', payload); } catch (e) { if (isNetworkError(e)) return queueAll('ส่งไม่สำเร็จ'); throw e; }
    for (const x of binRows) { try { await api.insert('bin', { ...x, place_id: row.id }); } catch (e) { if (isNetworkError(e)) Queue.push({ kind: 'bin', placeRef: row.id, payload: x, label: 'ถังของ ' + name }); else toast('ถังบางแถวบันทึกไม่ได้: ' + e.message, true); } }
    toast('บันทึกจุด ' + row.place_code + ' แล้ว' + (photoPayloads.length ? ' · กำลังส่งรูปต่อเบื้องหลัง' : ''));
    go('#place/' + row.id);                                   // ไปหน้าจุดทันที ไม่รอรูป (ส่งรูปใช้เวลาหลายวินาที)
    if (photoPayloads.length) uploadPhotosInBackground(row.id, photoPayloads, name);
  } catch (e) { toast(e.message, true); } finally { b.disabled = false; b.textContent = btnText; }
}

async function uploadPhotosInBackground(placeId, payloads, label) {
  let okCount = 0;
  for (let i = 0; i < payloads.length; i++) {
    toast(`กำลังส่งรูป ${i + 1}/${payloads.length}…`);
    try { const row = await savePhoto(placeId, payloads[i]); okCount++; toast(`ส่งรูป ${i + 1}/${payloads.length} แล้ว` + (row._size ? ` (${Math.round(row._size / 1024)} KB)` : '')); }
    catch (e) { if (isNetworkError(e)) { Queue.push({ kind: 'photo', placeRef: placeId, payload: payloads[i], label: 'รูปของ ' + label }); toast('ไม่มีสัญญาณ เก็บรูปไว้ส่งภายหลัง'); } else toast('ส่งรูปไม่สำเร็จ: ' + e.message, true); }
  }
  if (okCount && location.hash === '#place/' + placeId) render();   // ยังอยู่หน้าจุดนั้น → แสดงรูปที่เพิ่งส่ง
}

// ---- รูป ----
async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const scale = Math.min(1, CONFIG.PHOTO_MAX_PX / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', CONFIG.PHOTO_QUALITY); URL.revokeObjectURL(img.src);
  return { mime: 'image/jpeg', data: dataUrl.split(',')[1], filename: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' };
}
async function savePhoto(placeId, ph) {
  const [p] = await api.list('place', { eq: { id: placeId } });
  const muni = muniOf(p.municipality_id);
  const endpoint = muni.photo_endpoint_url || setting('default_photo_endpoint_url') || '';
  const existing = await api.list('place_photo', { eq: { place_id: placeId, status: 'active' } });
  if (existing.length >= maxPhotos()) throw new Error(`จุดนี้มีรูปครบ ${maxPhotos()} รูปแล้ว`);   // ตรวจก่อนส่งรูป (ฐานข้อมูลตรวจซ้ำอีกชั้น)
  const up = await api.uploadPhoto(endpoint, { ...ph, municipality_code: muni.code, place_code: p.place_code, filename: `${p.place_code}_${Date.now()}.jpg` });
  const row = await api.insert('place_photo', { place_id: placeId, seq: existing.length + 1, storage_kind: 'gdrive', file_id: up.file_id, url: up.url, taken_at: new Date().toISOString() });
  row._size = up.size; return row;
}
async function addPhoto(placeId, file) {
  if (!file) return; toast('กำลังย่อและส่งรูป…');
  try { const ph = await compressImage(file); try { const row = await savePhoto(placeId, ph); toast('เพิ่มรูปแล้ว' + (row._size ? ` (${Math.round(row._size / 1024)} KB)` : '')); } catch (e) { if (!isNetworkError(e)) throw e; Queue.push({ kind: 'photo', placeRef: placeId, payload: ph, label: 'รูป (เพิ่มภายหลัง)' }); toast('ไม่มีสัญญาณ เก็บรูปไว้ส่งภายหลัง'); } render(); } catch (e) { toast(e.message, true); }
}

// ปลั๊กอินเล็ก: เขียนป้ายข้างจุดที่ dataset กำหนด ptLabels (Chart.js ไม่มีป้ายจุดในตัว)
// ปลั๊กอินเล็ก: เขียนป้ายข้างจุดที่ dataset กำหนด ptLabels · เลือกตำแหน่ง ขวา/ซ้าย/บน/ล่าง ที่ไม่ทับป้ายอื่นและไม่ล้นกรอบ · มีพื้นขาวให้อ่านง่าย
const ptLabelPlugin = { id: 'ptLabels', afterDatasetsDraw(chart) { const { ctx, chartArea: A } = chart; const placed = []; chart.data.datasets.forEach((ds, di) => { if (!ds.ptLabels) return; chart.getDatasetMeta(di).data.forEach((el, i) => { const t = ds.ptLabels[i]; if (!t) return; ctx.save(); ctx.font = '600 13px system-ui, "Noto Sans Thai", sans-serif'; const w = ctx.measureText(t).width + 8, h = 20;
  const cands = [[el.x + 10, el.y - h / 2], [el.x - 10 - w, el.y - h / 2], [el.x - w / 2, el.y - 12 - h], [el.x - w / 2, el.y + 12]];
  const fits = ([x, y]) => x >= A.left && x + w <= A.right && y >= A.top && y + h <= A.bottom && !placed.some(b => x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y);
  const [x, y] = cands.find(fits) || cands[0]; placed.push({ x, y, w, h });
  ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#1f2430'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x + 4, y + h / 2); ctx.restore(); }); }); } };

// ---------- หน้า 2 วิเคราะห์เชิงลึก ----------
async function pageDashResearch(view) {
  const { places, bins, roads } = await loadDashData();
  const qs = new URLSearchParams((location.hash.split('?')[1] || '')); if (qs.get('road')) { S.dash.road = [qs.get('road')]; history.replaceState(null, '', '#dashboard/research'); }
  const roadOpts = roads.filter(r => +r.places > 0).sort((a, b) => String(a.road_name).localeCompare(String(b.road_name), 'th')).map(r => ({ value: r.road_id, label: r.road_name + (S.scopeMuni ? '' : ` (${r.municipality_code})`) }));
  const typeOpts = S.cache.bin_type.map(t => ({ value: t.id, label: t.name })).filter(o => bins.some(b => b.bin_type_id === o.value));
  const ptOpts = S.cache.place_type.map(t => ({ value: t.id, label: t.name }));
  view.innerHTML = `${scopeSelector()}${dashTabs('research')}
    <div class="card"><div style="font-size:18px;font-weight:700;color:${DASH.navy}">จำนวนเทียบความจุ: ใครถือภาระของเมือง</div><div class="muted">${esc(scopeName())} · ตัวกรองมีผลกับทุกกราฟและตารางในหน้านี้</div>
      <div class="row" style="margin-top:8px;align-items:flex-start">${multiPick('pk_road', 'ถนน', roadOpts, S.dash.road)}${multiPick('pk_type', 'ประเภทถัง', typeOpts, S.dash.type)}${multiPick('pk_ptype', 'ประเภทจุด', ptOpts, S.dash.ptype)}<button class="small secondary" onclick="S.dash.road=[];S.dash.type=[];S.dash.ptype=[];render()">ล้างทั้งหมด</button></div></div>
    <div id="dashBody"></div>`;
  const charts = []; S._page = 0;
  const draw = () => {
    S.dash.road = pickValues('pk_road'); S.dash.type = pickValues('pk_type'); S.dash.ptype = pickValues('pk_ptype');
    const fr = new Set(S.dash.road), ft = new Set(S.dash.type), fp = new Set(S.dash.ptype);
    let ps = places.filter(p => (!fr.size || fr.has(p.road_id)) && (!fp.size || fp.has(p.place_type_id)));
    const pid = new Set(ps.map(p => p.id));
    const bs = bins.filter(b => pid.has(b.place_id) && (!ft.size || ft.has(b.bin_type_id)));
    if (ft.size) { const has = new Set(bs.map(b => b.place_id)); ps = ps.filter(p => has.has(p.id)); }   // กรองประเภทถัง → นับเฉพาะจุดที่มีถังประเภทนั้น และนับลิตรเฉพาะประเภทนั้น
    const agg = {}; for (const b of bs) { agg[b.place_id] = agg[b.place_id] || { bins: 0, liters: 0 }; agg[b.place_id].bins += +b.amount; agg[b.place_id].liters += +b.liters; }
    const rows = ps.map(p => ({ ...p, f_bins: (agg[p.id] || {}).bins || 0, f_liters: (agg[p.id] || {}).liters || 0 })).sort((a, b) => b.f_liters - a.f_liters);
    const totL = sum(rows, 'f_liters'), totB = sum(rows, 'f_bins'); const tiers = tiersSorted();
    // รายถนน
    const byRoad = {}; for (const r of rows) { byRoad[r.road_id] = byRoad[r.road_id] || { name: r.road_name + (S.scopeMuni ? '' : ` (${r.municipality_code})`), n: 0, liters: 0 }; byRoad[r.road_id].n++; byRoad[r.road_id].liters += r.f_liters; }
    const roadArr = Object.values(byRoad).sort((a, b) => b.liters - a.liters);
    let cum = 0, heavy = 0; for (const r of roadArr) { if (cum < totL / 2) heavy++; cum += r.liters; }   // ถนนกลุ่มแรกที่รวมกันถือความจุเกินครึ่ง (ไม่ฟิกตัวเลขลิตร)
    // Pareto
    let c2 = 0; const cumPts = rows.map((r, i) => { c2 += r.f_liters; return { x: i + 1, y: pct(c2, totL) }; });
    const half = cumPts.findIndex(p => p.y > 50) + 1; const topTier = tiers[tiers.length - 1]; const nTop = rows.filter(r => r.tier_label === topTier.label).length;

      <div class="kpis">${card(fmt(sum(rows, 'amount')), 'ใบทั้งหมด', `ปกติ ${fmt(binsBy('ปกติ'))} · ชำรุด ${fmt(binsBy('ชำรุด'))} · หาย ${fmt(binsBy('หาย'))}`)}${card(fmt(Math.round(purchase)), 'มูลค่าซื้อประมาณการ (บาท)', `${fmt(sum(priced, 'amount'))} ใบที่มีราคา`)}${card(fmt(Math.round(book)), 'มูลค่าคงเหลือประมาณการ (บาท)', `${fmt(sum(bookable, 'amount'))} ใบที่คำนวณได้`)}${card(fmt(Math.round(sum(bookable, 'purchase_value') - book)), 'ค่าเสื่อมสะสมประมาณการ (บาท)')}${card(fmt(sum(noYear, 'amount')), 'ใบที่ไม่ทราบปีซื้อ', 'กรอกปีงบที่แถวถังเพื่อคำนวณ')}</div>

    charts.push(mkChart($('#cFyVal'), { type: 'bar', data: { labels: fys, datasets: [{ label: 'มูลค่าซื้อ (บาท)', data: fys.map(f => Math.round(fyAgg[f].value)), backgroundColor: DASH.navy }] }, options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${fmt(c.raw)} บาท` } } } } }));
  };
  S._dashDraw = draw; draw();
}
function exportCsv(rows, name) {
  if (!rows || !rows.length) return toast('ไม่มีข้อมูล', true);
  const cols = Object.keys(rows[0]); const csv = '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `ubwast_${name}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

async function pageRoutes(view) {
  if (!S.scopeMuni) return view.innerHTML = scopeSelector() + '<div class="card muted">เลือกเทศบาลก่อน</div>';
  const routes = await api.list('v_route_summary', { eq: { municipality_id: S.scopeMuni }, order: ['route_name'] });
  const sel = (location.hash.split('/')[1]) || (routes[0] && routes[0].route_id);
  const kindLabel = r => r.route_kind === 'temporary' ? `ชั่วคราว${r.valid_from || r.valid_to ? ` ${r.valid_from || '…'} ถึง ${r.valid_to || '…'}` : ''}` : 'ประจำ';
  view.innerHTML = `${scopeSelector()}<div class="card"><label style="margin-top:0">เลือกเส้นทาง / รถ</label><select onchange="go('#routes/'+this.value)">${routes.map(r => `<option value="${r.route_id}" ${r.route_id === sel ? 'selected' : ''}>${esc(r.route_name)} · ${esc(r.truck_code)}${r.status !== 'active' ? ' (ยกเลิก)' : ''} · ${kindLabel(r)}</option>`).join('')}</select>
    ${!routes.length ? '<div class="muted">ยังไม่มีเส้นทาง ให้ admin เพิ่มที่เมนู "จัดการเทศบาล"</div>' : ''}<div id="routeInfo"></div></div><div id="map"></div>`;
  const r = routes.find(x => x.route_id === sel); if (!r) return;
  const over = r.load_pct != null && r.load_pct > 100;
  $('#routeInfo').innerHTML = `<div class="kpis" style="margin-top:10px"><div class="kpi"><div class="v">${fmt(r.roads)}</div><div class="l">ถนน</div></div><div class="kpi"><div class="v">${fmt(r.places)}</div><div class="l">จุด</div></div><div class="kpi"><div class="v">${fmt(r.total_liters)}</div><div class="l">ลิตร${r.est_weight_kg != null ? ` ≈ ${fmt(r.est_weight_kg)} กก.` : ''}</div></div><div class="kpi"><div class="v" style="${over ? 'color:var(--danger)' : ''}">${r.load_pct == null ? '-' : fmt(r.load_pct) + '%'}</div><div class="l">ของความจุรถ ${r.truck_capacity_liters ? fmt(r.truck_capacity_liters) + ' ล.' : '(ไม่ได้ระบุ)'}</div></div></div>
    <div class="muted" style="margin-top:6px"><span class="pill">${kindLabel(r)}</span> ${esc(r.schedule_note || '')}${over ? ' · <b style="color:var(--danger)">เกินความจุรถ</b>' : ''}</div>
    ${+r.shared_roads > 0 ? `<div class="banner info" style="margin-top:8px">เพื่อทราบ: ถนน ${fmt(r.shared_roads)} สายในเส้นทางนี้ มีรถคันอื่นรับผิดชอบด้วย (ยอดลิตรจึงนับซ้ำกันระหว่างเส้นทาง)</div>` : ''}
    <div class="row" style="margin-top:8px"><button class="secondary small" onclick="printDriverReport('${r.route_id}')">🖨 รายงานแจ้งคนขับ</button></div>`;
  const stops = (await api.list('v_route_place', { eq: { route_id: sel } })).filter(x => x.place_id).sort((a, b) => a.road_seq - b.road_seq || String(a.place_code).localeCompare(String(b.place_code), 'th'));
  const map = L.map('map'); addBaseLayer(map);
  const all = (await api.list('v_place', { eq: { status: 'active', municipality_id: S.scopeMuni } })).filter(p => p.lat != null);
  const inRoute = new Set(stops.map(s => s.place_id));
  const g = L.featureGroup().addTo(map);
  for (const p of all) L.circleMarker([p.lat, p.lng], { radius: inRoute.has(p.id) ? 10 : 5, color: '#fff', weight: 1, fillColor: inRoute.has(p.id) ? (p.tier_color || '#1b6e3a') : '#9ca3af', fillOpacity: inRoute.has(p.id) ? .95 : .5 }).bindPopup(`<b>${esc(p.place_code)}</b><br>${esc(p.name)}<br>${fmt(p.total_liters)} ลิตร`).addTo(g);
  const line = stops.filter(s => s.lat != null).map(s => [s.lat, s.lng]);
  if (line.length > 1) L.polyline(line, { color: '#1b6e3a', weight: 3, dashArray: '6 6' }).addTo(g);
  if (all.length) map.fitBounds(g.getBounds().pad(0.2)); else map.setView([CONFIG.MAP_FALLBACK.lat, CONFIG.MAP_FALLBACK.lng], CONFIG.MAP_FALLBACK.zoom);
  S._routeStops = stops; S._route = r;
  $('#routeInfo').insertAdjacentHTML('beforeend', `<details style="margin-top:8px"><summary>ลำดับจุดในเส้นทาง (${stops.length})</summary><table><thead><tr><th>#</th><th>ถนน</th><th>จุด</th><th style="text-align:right">ลิตร</th></tr></thead><tbody>${stops.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.road_name)}</td><td><a href="#place/${s.place_id}">${esc(s.place_code)}</a> ${esc(s.place_name)}</td><td style="text-align:right">${fmt(s.total_liters)}</td></tr>`).join('')}</tbody></table></details><div class="muted">เส้นประเชื่อมจุดตามลำดับถนน ไม่ใช่เส้นทางวิ่งจริงบนถนน</div>`);
}

// รายงานแจ้งคนขับ: หน้าพิมพ์ (DEC-082) — เปิดหน้าต่างใหม่แล้วสั่งพิมพ์/บันทึกเป็น PDF จากเบราว์เซอร์
function printDriverReport(routeId) {
  const r = S._route, stops = S._routeStops || []; if (!r || r.route_id !== routeId) return toast('เปิดเส้นทางก่อน', true);
  const muni = muniOf(r.municipality_id); const kind = r.route_kind === 'temporary' ? `งานชั่วคราว ${r.valid_from || ''}${r.valid_to ? ' ถึง ' + r.valid_to : ''}` : 'งานประจำ';
  let seq = 0, lastRoad = null;
  const rows = stops.map(s => { if (s.road_name !== lastRoad) { lastRoad = s.road_name; seq = 0; } seq++; return `<tr><td>${esc(s.road_name)}</td><td>${seq}</td><td>${esc(s.place_code)}</td><td>${esc(s.place_name)}</td><td style="text-align:right">${fmt(s.total_bins)}</td><td style="text-align:right">${fmt(s.total_liters)}</td><td></td></tr>`; }).join('');
  const html = `<!doctype html><html lang="th"><head><meta charset="utf-8"><title>รายงานเส้นทาง ${esc(r.route_name)}</title>
    <style>body{font:14px/1.4 system-ui,"Noto Sans Thai",sans-serif;margin:20px;color:#000}h1{font-size:18px;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #999;padding:4px 6px;text-align:left}th{background:#eee}.meta{color:#333}@media print{button{display:none}}</style></head><body>
    <button onclick="window.print()">พิมพ์ / บันทึก PDF</button>
    <h1>${esc(setting('system_name') || 'ระบบข้อมูลจุดวางถังขยะ')} — รายงานเส้นทางเดินรถ</h1>
    <div class="meta">${esc(muni.name || '')} · เส้นทาง <b>${esc(r.route_name)}</b> · รถ <b>${esc(r.truck_code)}</b> ${esc(r.plate_no || '')} · ${kind}${r.schedule_note ? ' · ' + esc(r.schedule_note) : ''}</div>
    <div class="meta">ถนน ${fmt(r.roads)} สาย · จุด ${fmt(r.places)} จุด · รวม ${fmt(r.total_bins)} ใบ · ${fmt(r.total_liters)} ลิตร${r.truck_capacity_liters ? ` · ความจุรถ ${fmt(r.truck_capacity_liters)} ลิตร (${fmt(r.load_pct)}%)` : ''} · พิมพ์เมื่อ ${thDate(new Date().toISOString())}</div>
    <table><thead><tr><th>ถนน</th><th>#</th><th>รหัสจุด</th><th>จุด</th><th>ใบ</th><th>ลิตร</th><th style="width:90px">เก็บแล้ว ✓</th></tr></thead><tbody>${rows || '<tr><td colspan="7">ไม่มีจุดในเส้นทาง</td></tr>'}</tbody></table></body></html>`;
  const w = window.open('', '_blank'); if (!w) return toast('เบราว์เซอร์กันหน้าต่างใหม่ กรุณาอนุญาตป๊อปอัป', true);
  w.document.write(html); w.document.close();
}

// =====================================================================
// ตัวช่วย CRUD ทั่วไป (ใช้กับหน้า admin / super)
//   spec: { table, title, cols: [{key,label,type,options?,required?}], eq?, canDelete?, extraBtn? }

async function crudSection(spec) {
  const rows = await api.list(spec.table, { eq: spec.eq || {}, order: spec.order || [spec.cols[0].key] });
  spec._rows = rows; const id = 'sec_' + spec.table;
  const cell = (r, c) => c.type === 'select' ? esc((c.options().find(o => o.value === r[c.key]) || {}).label || '') : c.type === 'status' ? (r[c.key] === 'active' ? '<span class="pill">ใช้งาน</span>' : '<span class="pill" style="background:#fee2e2">ปิด</span>') : c.type === 'color' ? `<i class="dot" style="background:${esc(r[c.key])}"></i>${esc(r[c.key])}` : esc(r[c.key] ?? '');
  return `<div class="card" id="${id}"><div class="row" style="justify-content:space-between"><h4 style="margin:0">${spec.title} (${rows.length})</h4><div class="row">${spec.extraBtn || ''}${spec.noAdd ? '' : `<button class="small" onclick="crudForm('${spec.table}')">＋ เพิ่ม</button>`}</div></div>
    <div style="overflow:auto"><table><thead><tr>${spec.cols.filter(c => !c.hide).map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r => `<tr>${spec.cols.filter(c => !c.hide).map(c => `<td>${cell(r, c)}</td>`).join('')}<td style="white-space:nowrap"><button class="small secondary" onclick="crudForm('${spec.table}','${r.id || r.key}')">แก้</button>${spec.rowBtns ? spec.rowBtns(r) : ''}</td></tr>`).join('') || `<tr><td colspan="${spec.cols.length + 1}" class="muted">ยังไม่มีข้อมูล</td></tr>`}</tbody></table></div></div>`;
}
const SPECS = {};
function crudForm(table, id) {
  const spec = SPECS[table]; const r = id ? spec._rows.find(x => (x.id || x.key) === id) : {};
  openModal(`<h3 style="margin-top:0">${id ? 'แก้ไข' : 'เพิ่ม'} ${spec.title}</h3>${spec.cols.filter(c => !(c.readonly && id) && !(c.onlyEdit && !id)).map(c => `<label>${c.label}${c.required ? ' *' : ''}</label>` + (c.type === 'select' ? `<select id="c_${c.key}">${(c.nullable ? '<option value="">—</option>' : '') + c.options().map(o => `<option value="${o.value}" ${o.value === r[c.key] ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>` : c.type === 'status' ? `<select id="c_${c.key}"><option value="active" ${r[c.key] !== 'inactive' ? 'selected' : ''}>ใช้งาน</option><option value="inactive" ${r[c.key] === 'inactive' ? 'selected' : ''}>ปิดใช้งาน</option></select>` : c.type === 'textarea' ? `<textarea id="c_${c.key}" rows="2">${esc(r[c.key] ?? '')}</textarea>` : `<input id="c_${c.key}" type="${c.type === 'number' ? 'number' : 'text'}" step="any" value="${esc(r[c.key] ?? '')}" ${c.readonly && id ? 'readonly' : ''}>`)).join('')}
    <div class="row" style="margin-top:12px"><button id="c_save">บันทึก</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div>`);
  $('#c_save').onclick = async () => {
    const patch = {};
    for (const c of spec.cols) { const el = $('#c_' + c.key); if (!el) continue; let v = el.value; if (c.type === 'number') v = v === '' ? null : parseFloat(v); if (v === '' && (c.nullable || c.type === 'select')) v = null; if (c.required && (v == null || v === '')) return toast('กรอก ' + c.label, true); patch[c.key] = v; }
    if (spec.beforeSave) { const err = spec.beforeSave(patch, r); if (err) return toast(err, true); }
    try { if (id) await api.update(spec.table, r[spec.pk || 'id'], patch, spec.pk || 'id'); else await api.insert(spec.table, { ...(spec.defaults ? spec.defaults() : {}), ...patch }); closeModal(); toast('บันทึกแล้ว'); S.cache.loaded = false; render(); } catch (e) { toast(e.message, true); }
  };
}
function openModal(html) { closeModal(); const d = document.createElement('div'); d.className = 'modal-bg'; d.id = 'modal'; d.innerHTML = `<div class="modal">${html}</div>`; d.onclick = e => { if (e.target === d) closeModal(); }; document.body.appendChild(d); }
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

// =====================================================================

async function pageAdmin(view) {
  if (!S.scopeMuni) return view.innerHTML = scopeSelector() + '<div class="card muted">เลือกเทศบาลก่อน</div>';
  const mid = S.scopeMuni; const muni = muniOf(mid);
  const roads = await api.list('road', { eq: { municipality_id: mid }, order: ['name'] });
  const trucks = await api.list('truck', { eq: { municipality_id: mid }, order: ['code'] });
  SPECS.road = { table: 'road', title: 'ถนน', eq: { municipality_id: mid }, defaults: () => ({ municipality_id: mid }), cols: [{ key: 'name', label: 'ชื่อถนน', required: true }, { key: 'road_type', label: 'ประเภท' }, { key: 'status', label: 'สถานะ', type: 'status' }] };
  SPECS.soi = { table: 'soi', title: 'ซอย', eq: { municipality_id: mid }, defaults: () => ({ municipality_id: mid }), cols: [{ key: 'road_id', label: 'ถนน', type: 'select', required: true, options: () => roads.map(r => ({ value: r.id, label: r.name })) }, { key: 'name', label: 'ชื่อซอย', required: true }, { key: 'status', label: 'สถานะ', type: 'status' }] };
  SPECS.truck = { table: 'truck', title: 'รถเก็บขยะ', eq: { municipality_id: mid }, defaults: () => ({ municipality_id: mid }), cols: [{ key: 'code', label: 'รหัส/ชื่อรถ', required: true }, { key: 'plate_no', label: 'ทะเบียน' }, { key: 'truck_type_id', label: 'ประเภทรถ', type: 'select', nullable: true, options: () => S.cache.truck_type.map(t => ({ value: t.id, label: `${t.name} (${fmt(t.capacity_liters)} ล.)` })) }, { key: 'capacity_liters', label: 'ความจุเฉพาะคัน (ลิตร, ว่าง = ตามประเภท)', type: 'number', nullable: true }, { key: 'status', label: 'สถานะ', type: 'status' }] };
  SPECS.route = { table: 'route', title: 'เส้นทางเดินรถ', eq: { municipality_id: mid }, defaults: () => ({ municipality_id: mid }), cols: [{ key: 'name', label: 'ชื่อเส้นทาง', required: true }, { key: 'truck_id', label: 'รถ', type: 'select', required: true, options: () => trucks.map(t => ({ value: t.id, label: t.code })) }, { key: 'route_kind', label: 'ชนิด', type: 'select', options: () => [{ value: 'regular', label: 'ประจำ' }, { value: 'temporary', label: 'ชั่วคราว (เทศกาล/เฉพาะกิจ)' }] }, { key: 'valid_from', label: 'เริ่ม (ปี-เดือน-วัน ค.ศ. เฉพาะงานชั่วคราว)', nullable: true }, { key: 'valid_to', label: 'สิ้นสุด (ปี-เดือน-วัน ค.ศ.)', nullable: true }, { key: 'schedule_note', label: 'วัน/เวลาเก็บ' }, { key: 'status', label: 'สถานะ', type: 'status' }],
    beforeSave: p => { for (const k of ['valid_from', 'valid_to']) if (p[k] && !/^\d{4}-\d{2}-\d{2}$/.test(p[k])) return 'รูปแบบวันที่ต้องเป็น ปี-เดือน-วัน เช่น 2026-12-30'; if (p.valid_from && p.valid_to && p.valid_to < p.valid_from) return 'วันสิ้นสุดต้องไม่ก่อนวันเริ่ม'; },
    rowBtns: r => ` <button class="small secondary" onclick="routeRoads('${r.id}')">ถนนในเส้นทาง</button>` };
  SPECS.app_user = { table: 'app_user', title: 'บัญชีผู้ใช้', eq: { municipality_id: mid }, noAdd: true, cols: [{ key: 'display_name', label: 'ชื่อแสดง', required: true }, { key: 'username', label: 'ชื่อล็อกอิน', readonly: true }, { key: 'role', label: 'บทบาท', type: 'select', readonly: true, options: () => [{ value: 'admin', label: 'admin เทศบาล' }, { value: 'recorder', label: 'ผู้บันทึก' }] }, { key: 'status', label: 'สถานะ', type: 'status' }], extraBtn: `<button class="small" onclick="userForm('${mid}')">＋ เพิ่มผู้บันทึก</button>`, rowBtns: r => r.id !== S.me.id ? ` <button class="small secondary" onclick="resetPw('${r.id}','${esc(r.username)}')">รีเซ็ตรหัส</button>` : '' };
  SPECS.municipality = { table: 'municipality', title: 'ตั้งค่าเทศบาล', eq: { id: mid }, noAdd: true, cols: [{ key: 'code', label: 'รหัส', readonly: true }, { key: 'name', label: 'ชื่อ', readonly: !isSuper() }, { key: 'photo_endpoint_url', label: 'ลิงก์สคริปต์รับรูป (ว่าง = Drive ของเจ้าของโครงการ)', nullable: true }, { key: 'photo_folder_id', label: 'รหัสโฟลเดอร์ Drive (ไม่บังคับ)', nullable: true }, { key: 'note', label: 'หมายเหตุ', type: 'textarea', nullable: true }] };
  view.innerHTML = scopeSelector() + `<div class="banner info">เทศบาล ${esc(muni.code)} · ${esc(muni.name)} · เพดานผู้บันทึก ${muni.max_recorders} บัญชี</div>` + (await crudSection(SPECS.road)) + (await crudSection(SPECS.soi)) + (await crudSection(SPECS.truck)) + (await crudSection(SPECS.route)) + (await crudSection(SPECS.app_user)) + (await crudSection(SPECS.municipality));
}
async function routeRoads(routeId) {
  const mid = S.scopeMuni; const roads = await api.list('road', { eq: { municipality_id: mid, status: 'active' }, order: ['name'] });
  const rr = (await api.list('route_road', { eq: { route_id: routeId }, order: ['seq'] }));
  const draw = () => openModal(`<h3 style="margin-top:0">ถนนในเส้นทาง (ตามลำดับ)</h3><ol id="rrList">${rr.map((x, i) => `<li>${esc((roads.find(r => r.id === x.road_id) || {}).name || '?')} <button class="small secondary" onclick="rrMove(${i},-1)">↑</button> <button class="small secondary" onclick="rrMove(${i},1)">↓</button> <button class="small danger" onclick="rrDel(${i})">ลบ</button></li>`).join('') || '<li class="muted">ยังไม่มีถนน</li>'}</ol>
    <label>เพิ่มถนน</label><div class="row"><select id="rrAdd" style="flex:1">${roads.filter(r => !rr.some(x => x.road_id === r.id)).map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="small" onclick="rrAddRoad()">เพิ่ม</button></div>
    <div class="row" style="margin-top:12px"><button onclick="rrSave()">บันทึกลำดับ</button><button class="secondary" onclick="closeModal()">ปิด</button></div><div class="muted">จุดทุกจุดบนถนนที่เลือกจะนับเข้าเส้นทางนี้โดยอัตโนมัติ</div>`);
  window.rrMove = (i, d) => { const j = i + d; if (j < 0 || j >= rr.length) return; [rr[i], rr[j]] = [rr[j], rr[i]]; draw(); };
  window.rrDel = i => { rr.splice(i, 1); draw(); };
  window.rrAddRoad = () => { const id = $('#rrAdd').value; if (!id) return; rr.push({ route_id: routeId, road_id: id, _new: true }); draw(); };
  window.rrSave = async () => {
    try {
      const existing = await api.list('route_road', { eq: { route_id: routeId } });
      for (const e of existing) if (!rr.some(x => x.id === e.id)) await api.remove('route_road', e.id);
      for (let i = 0; i < rr.length; i++) { if (rr[i].id) await api.update('route_road', rr[i].id, { seq: i + 1 }); else await api.insert('route_road', { route_id: routeId, road_id: rr[i].road_id, seq: i + 1 }); }
      closeModal(); toast('บันทึกเส้นทางแล้ว');
    } catch (e) { toast(e.message, true); }
  };
  draw();
}
function userForm(mid) {
  const superRole = isSuper() ? `<label>บทบาท</label><select id="u_role"><option value="recorder">ผู้บันทึก</option><option value="admin">admin เทศบาล</option></select>` : '';
  openModal(`<h3 style="margin-top:0">เพิ่มบัญชี</h3><label>ชื่อล็อกอิน (a-z 0-9 . _ - เช่น ubn-rec2)</label><input id="u_name" autocapitalize="none"><label>ชื่อแสดง</label><input id="u_disp">${superRole}
    <div class="row" style="margin-top:12px"><button id="u_save">สร้างบัญชี</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div><div class="muted">รหัสผ่านจะถูกสุ่มและแสดงครั้งเดียว ให้จดส่งต่อผู้ใช้</div>`);

    try { const r = await api.engine('create_user', { username: $('#u_name').value.trim(), display_name: $('#u_disp').value.trim(), role: isSuper() ? $('#u_role').value : 'recorder', municipality_id: mid }); showCredentials([r.account]); } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'สร้างบัญชี'; }
  };
}
async function resetPw(userId, username) {
  if (!confirm(`รีเซ็ตรหัสผ่านของ ${username}?`)) return;
  try { const r = await api.engine('reset_password', { user_id: userId }); showCredentials([{ username: r.username, password: r.password }]); } catch (e) { toast(e.message, true); }
}
function showCredentials(accs) {
  openModal(`<h3 style="margin-top:0">บัญชีที่สร้าง/รีเซ็ต — แสดงครั้งเดียว</h3>${accs.map(a => `<div class="card"><div>ชื่อล็อกอิน: <b class="mono">${esc(a.username)}</b></div><div>รหัสผ่าน: <b class="mono">${esc(a.password)}</b></div>${a.role ? `<div class="muted">${roleLabel(a.role)}</div>` : ''}</div>`).join('')}
    <div class="banner warn">จดหรือถ่ายภาพหน้านี้ก่อนปิด ระบบจะไม่แสดงรหัสผ่านนี้อีก</div><button onclick="closeModal();S.cache.loaded=false;render()">ปิด</button>`);
}

async function pageSuper(view) {
  SPECS.municipality = { table: 'municipality', title: 'เทศบาล', noAdd: true, order: ['code'], cols: [{ key: 'code', label: 'รหัส', readonly: true }, { key: 'name', label: 'ชื่อ', required: true }, { key: 'max_recorders', label: 'เพดานผู้บันทึก', type: 'number', required: true }, { key: 'status', label: 'สถานะ', type: 'status' }, { key: 'photo_endpoint_url', label: 'ลิงก์สคริปต์รับรูป', nullable: true, hide: true }, { key: 'note', label: 'หมายเหตุ', type: 'textarea', nullable: true, hide: true }], extraBtn: `<button class="small" onclick="muniForm()">＋ สร้างเทศบาล (พร้อม 2 บัญชี)</button>`, rowBtns: r => ` <button class="small secondary" onclick="S.scopeMuni='${r.id}';go('#admin')">จัดการ</button>` };

  SPECS.truck_type = { table: 'truck_type', title: 'ประเภทรถ', order: ['sort_order'], cols: [{ key: 'name', label: 'ชื่อ', required: true }, { key: 'capacity_liters', label: 'ความจุ (ลิตร)', type: 'number', nullable: true }, { key: 'detail', label: 'รายละเอียด', nullable: true }, { key: 'sort_order', label: 'ลำดับ', type: 'number' }, { key: 'status', label: 'สถานะ', type: 'status' }] };
  SPECS.place_type = { table: 'place_type', title: 'ประเภทจุด', order: ['sort_order'], cols: [{ key: 'name', label: 'ชื่อ', required: true }, { key: 'sort_order', label: 'ลำดับ', type: 'number' }, { key: 'status', label: 'สถานะ', type: 'status' }] };
  SPECS.capacity_tier = { table: 'capacity_tier', title: 'เกณฑ์สีหมุด', order: ['sort_order'], cols: [{ key: 'label', label: 'ป้าย', required: true }, { key: 'min_liters', label: 'ตั้งแต่ (ลิตร)', type: 'number', required: true }, { key: 'max_liters', label: 'ถึง (ลิตร, ว่าง = ไม่จำกัด)', type: 'number', nullable: true }, { key: 'color', label: 'รหัสสี', type: 'color', required: true }, { key: 'sort_order', label: 'ลำดับ', type: 'number' }] };
  SPECS.app_setting = { table: 'app_setting', title: 'ค่าตั้งค่าส่วนกลาง', noAdd: true, pk: 'key', order: ['key'], cols: [{ key: 'key', label: 'ค่า', readonly: true }, { key: 'value', label: 'ค่าที่ตั้ง', nullable: true }, { key: 'description', label: 'คำอธิบาย', readonly: true }] };
  view.innerHTML = `<div class="banner info">ส่วนกลาง: ค่าที่นี่ใช้เหมือนกันทุกเทศบาล (DEC-079)</div>${(setting('asset_prices_status') || 'ประมาณการ') !== 'ยืนยันแล้ว' ? `<div class="banner warn">ราคามาตรฐานต่อใบและอายุใช้งานของประเภทถังเป็น <b>ค่าประมาณการตั้งต้น</b> (DEC-089) · ตรวจแล้วแก้ที่ตาราง "ประเภทถัง" จากนั้นตั้งค่า asset_prices_status = ยืนยันแล้ว เพื่อปิดป้ายเตือนบนแดชบอร์ด</div>` : ''}` + (await crudSection(SPECS.municipality)) + (await crudSection(SPECS.bin_type)) + (await crudSection(SPECS.truck_type)) + (await crudSection(SPECS.place_type)) + (await crudSection(SPECS.capacity_tier)) + (await crudSection(SPECS.app_setting));
}
function muniForm() {

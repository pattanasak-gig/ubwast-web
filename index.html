// =====================================================================

// =====================================================================
const CONFIG = {
  SUPABASE_URL: 'https://cbmaqzocmgvbjubdvfsz.supabase.co',
  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_WWVj5eL3Cw3cfNK4rEY5hw_kcvrrGcO',
  LOGIN_EMAIL_DOMAIN: 'ubwast.local',   // ต้องตรงกับ LOGIN_EMAIL_DOMAIN ในห้องเครื่อง Apps Script
  ENGINE_URL: 'https://script.google.com/macros/s/AKfycbylaxh8Tp5P0ptgCBY4-aBpkwAgrP6vcV25Bng9sAbSQneeruuDDeN5dfoISCArNoqlqQ/exec',  // Web app URL ของ apps-script/engine (deploy เวอร์ชัน 1, 21 ต.ค. 2569)

  // แผนที่พื้นหลัง (tile) — เปลี่ยนผู้ให้บริการได้ที่นี่ · OSM ต้องการ Referer จึงอาจถูกบล็อกเมื่อเปิดจาก file:// (MIS-007)

  TILES_FALLBACK: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attribution: 'Tiles © Esri', maxZoom: 19 },
  ROUTING_URL: 'https://router.project-osrm.org',   // DEC-091 บริการคำนวณเส้นทางบนถนน (OSRM สาธิต · ใช้ไม่เชิงพาณิชย์ · ≤1 คำขอ/วินาที · ไม่รับประกัน) · เรียกเฉพาะตอน admin กด "ลากเส้นตามถนน" แล้วเก็บผลในฐานข้อมูล

  .subtabs a.active { background:#1F3A5F; color:#fff; border-color:#1F3A5F; font-weight:600; }
  .finding { background:#1F3A5F; color:#fff; border-radius:12px; padding:14px 16px; display:flex; gap:14px; align-items:center; margin-bottom:12px; }

  .finding b { color:#E9D5FF; }

  .cardhead h4 { margin:0; }
  .infobtn { width:44px; height:44px; padding:0; border-radius:50%; background:#fff; color:#1F3A5F; border:1px solid #cbd5e1; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; vertical-align:middle; margin-left:6px; }   /* ชื่อ infobtn ไม่ใช่ info เพราะชนกับ .banner.info (MIS-011) */
  .infobtn:hover { background:#eff6ff; }

<body>
<header>
  <h1 id="title">ระบบข้อมูลจุดวางถังขยะ</h1>
  <span id="who" class="muted" style="color:#dbeafe;font-size:13px"></span>
  <button id="btnQueue" class="hidden" onclick="go('#queue')">รอส่ง <b id="queueCount">0</b></button>
  <button onclick="go('#me')">บัญชี</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// สถานะรวมของแอป
// =====================================================================
const S = {
  me: null,           // โปรไฟล์ app_user ของผู้ล็อกอิน
  scopeMuni: null,    // เทศบาลที่กำลังดู (super admin เลือกได้ · คนอื่น = เทศบาลตน)
  munis: [],          // เทศบาลที่มองเห็น
  cache: {},          // ตารางแม่ที่โหลดแล้ว
  map: null, markers: null,
  charts: []
};
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n == null ? '-' : Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 }));
const thDate = iso => iso ? new Date(iso).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
const IS_DEMO = CONFIG.DEMO || /[?&]demo=1/.test(location.search);

function toast(msg, isErr) {
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  $('#toastHost').appendChild(t); setTimeout(() => t.remove(), isErr ? 5000 : 2500);
}
function go(hash) { location.hash = hash; }
function isNetworkError(e) { return !navigator.onLine || /fetch|network|Failed|load failed|timeout/i.test(String(e && (e.message || e))); }

// =====================================================================
// ชั้นข้อมูล A: Supabase จริง
// =====================================================================
const SupaBackend = () => {
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY);
  const unwrap = r => { if (r.error) throw new Error(r.error.message || JSON.stringify(r.error)); return r.data; };
  const applyOpts = (qb, o = {}) => {
    for (const [k, v] of Object.entries(o.eq || {})) qb = qb.eq(k, v);
    for (const [k, v] of Object.entries(o.in || {})) qb = qb.in(k, v);
    if (o.order) qb = qb.order(o.order[0], { ascending: o.order[1] !== false });
    if (o.limit) qb = qb.limit(o.limit);
    return qb;
  };
  return {
    name: 'supabase',
    async session() { return unwrap(await sb.auth.getSession()).session; },
    async login(username, password) {
      const email = username.includes('@') ? username : `${username.trim().toLowerCase()}@${CONFIG.LOGIN_EMAIL_DOMAIN}`;
      unwrap(await sb.auth.signInWithPassword({ email, password }));
      return this.me();
    },
    async logout() { await sb.auth.signOut(); },
    async me() {
      const sess = await this.session(); if (!sess) return null;
      const rows = unwrap(await sb.from('app_user').select('*').eq('id', sess.user.id));
      return rows[0] || null;
    },
    async changePassword(pw) { unwrap(await sb.auth.updateUser({ password: pw })); },
    async list(name, o) { return unwrap(await applyOpts(sb.from(name).select(o?.select || '*'), o)); },
    async insert(table, row) { return unwrap(await sb.from(table).insert(row).select().single()); },
    async update(table, id, patch, pk = 'id') { return unwrap(await sb.from(table).update(patch).eq(pk, id).select().single()); },
    async remove(table, id) { unwrap(await sb.from(table).delete().eq('id', id)); },
    async engine(action, payload) {
      if (!CONFIG.ENGINE_URL) throw new Error('ยังไม่ได้ตั้งค่า ENGINE_URL (ห้องเครื่อง Apps Script ขั้นที่ 4)');
      const sess = await this.session(); if (!sess) throw new Error('ไม่ได้ล็อกอิน');
      const r = await fetch(CONFIG.ENGINE_URL, { method: 'POST', body: JSON.stringify({ action, token: sess.access_token, ...payload }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ห้องเครื่องตอบผิดพลาด'); return j;
    },
    async uploadPhoto(endpointUrl, payload) {
      const url = endpointUrl || CONFIG.ENGINE_URL;
      if (!url) throw new Error('ยังไม่ได้ตั้งค่าที่เก็บรูป (ENGINE_URL หรือสคริปต์รับรูปของเทศบาล)');
      const sess = await this.session();
      const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'upload_photo', token: sess.access_token, ...payload }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ส่งรูปไม่สำเร็จ'); return j;
    }
  };
};

// =====================================================================
// ชั้นข้อมูล B: โหมดสาธิต (ข้อมูลตัวอย่างในหน่วยความจำ เลียนแบบ RLS และ view)
// =====================================================================
const DemoBackend = () => {
  const uid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  const now = () => new Date().toISOString();
  const D = { municipality: [], app_user: [], bin_type: [], truck_type: [], place_type: [], capacity_tier: [], app_setting: [],
              road: [], soi: [], truck: [], route: [], route_road: [], route_stop: [], place: [], bin: [], place_photo: [] };
  const add = (t, row) => { const r = { id: uid(), status: 'active', created_at: now(), updated_at: now(), ...row }; D[t].push(r); return r; };
  // --- ข้อมูลตัวอย่าง (เหมือน sql/020_sample_data.sql) ---
  const m1 = add('municipality', { code: 'DEMO1', name: 'เทศบาลตัวอย่าง หนึ่ง', max_recorders: 3, photo_endpoint_url: '' });
  const m2 = add('municipality', { code: 'DEMO2', name: 'เทศบาลตัวอย่าง สอง', max_recorders: 3, photo_endpoint_url: '' });
  const users = [
    add('app_user', { username: 'owner', display_name: 'เจ้าของโครงการ (สาธิต)', role: 'super_admin', municipality_id: null }),
    add('app_user', { username: 'demo1-admin', display_name: 'admin เทศบาลหนึ่ง', role: 'admin', municipality_id: m1.id }),
    add('app_user', { username: 'demo1-rec1', display_name: 'ผู้บันทึก หนึ่ง', role: 'recorder', municipality_id: m1.id }),
    add('app_user', { username: 'demo2-admin', display_name: 'admin เทศบาลสอง', role: 'admin', municipality_id: m2.id }),
    add('app_user', { username: 'demo2-rec1', display_name: 'ผู้บันทึก สอง', role: 'recorder', municipality_id: m2.id })
  ];
  const bt120 = add('bin_type', { name: 'ตัวอย่าง ถัง 120 ลิตร', liters: 120, color: 'เขียว', sort_order: 1, unit_cost: 1000, useful_life_years: 5 });
  const bt240 = add('bin_type', { name: 'ตัวอย่าง ถัง 240 ลิตร', liters: 240, color: 'น้ำเงิน', sort_order: 2, unit_cost: 2000, useful_life_years: 5 });
  const bt4000 = add('bin_type', { name: 'ตัวอย่าง คอนเทนเนอร์ 4,000 ลิตร', liters: 4000, color: 'เหลือง', sort_order: 3, unit_cost: 70000, useful_life_years: 10 });

  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch { return []; } },

  async sync() {
    if (this.syncing || !navigator.onLine) return;
    this.syncing = true;

      try {
        if (it.kind === 'place') { const row = await api.insert('place', it.payload); idMap[it.tempId] = row.id; it.realId = row.id; }
        if (it.kind === 'bin') { const pid = idMap[it.placeRef] || it.placeRef; if (String(pid).startsWith('tmp')) throw new Error('จุดยังไม่ถูกส่ง'); await api.insert('bin', { ...it.payload, place_id: pid }); }

}

// ---- รูป ----
async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const scale = Math.min(1, CONFIG.PHOTO_MAX_PX / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', CONFIG.PHOTO_QUALITY); URL.revokeObjectURL(img.src);
  return { mime: 'image/jpeg', data: dataUrl.split(',')[1], filename: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' };
}
async function savePhoto(placeId, ph) {
  const [p] = await api.list('place', { eq: { id: placeId } });
  const muni = muniOf(p.municipality_id);
  const endpoint = muni.photo_endpoint_url || setting('default_photo_endpoint_url') || '';
  const existing = await api.list('place_photo', { eq: { place_id: placeId, status: 'active' } });
  if (existing.length >= maxPhotos()) throw new Error(`จุดนี้มีรูปครบ ${maxPhotos()} รูปแล้ว`);   // ตรวจก่อนส่งรูป (ฐานข้อมูลตรวจซ้ำอีกชั้น)
  const up = await api.uploadPhoto(endpoint, { ...ph, municipality_code: muni.code, place_code: p.place_code, filename: `${p.place_code}_${Date.now()}.jpg` });
  const row = await api.insert('place_photo', { place_id: placeId, seq: existing.length + 1, storage_kind: 'gdrive', file_id: up.file_id, url: up.url, taken_at: new Date().toISOString() });
  row._size = up.size; return row;
}
async function addPhoto(placeId, file) {
  if (!file) return; toast('กำลังย่อและส่งรูป…');
  try { const ph = await compressImage(file); try { const row = await savePhoto(placeId, ph); toast('เพิ่มรูปแล้ว' + (row._size ? ` (${Math.round(row._size / 1024)} KB)` : '')); } catch (e) { if (!isNetworkError(e)) throw e; Queue.push({ kind: 'photo', placeRef: placeId, payload: ph, label: 'รูป (เพิ่มภายหลัง)' }); toast('ไม่มีสัญญาณ เก็บรูปไว้ส่งภายหลัง'); } render(); } catch (e) { toast(e.message, true); }
}

function dashApply() { if (S._dashDraw) S._dashDraw(); document.querySelectorAll('.pick').forEach(d => { const n = d.querySelectorAll('input:checked').length; const b = d.querySelector('summary b'); if (b) b.textContent = n ? n + ' รายการ' : 'ทั้งหมด'; }); }
function destroyCharts(list) { list.forEach(c => { c.destroy(); const i = S.charts.indexOf(c); if (i >= 0) S.charts.splice(i, 1); }); list.length = 0; }

function mkChart(el, cfg) { const c = new Chart(el, cfg); S.charts.push(c); const i = S._info && S._info[CHART_KEY[el.id]]; el.setAttribute('role', 'img'); el.setAttribute('aria-label', i ? `${i.title}: ${i.interp}` : 'กราฟ'); return c; }   // A11
// ปลั๊กอินเล็ก: เขียนป้ายข้างจุดที่ dataset กำหนด ptLabels (Chart.js ไม่มีป้ายจุดในตัว)
// ปลั๊กอินเล็ก: เขียนป้ายข้างจุดที่ dataset กำหนด ptLabels · เลือกตำแหน่ง ขวา/ซ้าย/บน/ล่าง ที่ไม่ทับป้ายอื่นและไม่ล้นกรอบ · มีพื้นขาวให้อ่านง่าย
const ptLabelPlugin = { id: 'ptLabels', afterDatasetsDraw(chart) { const { ctx, chartArea: A } = chart; const placed = []; chart.data.datasets.forEach((ds, di) => { if (!ds.ptLabels) return; chart.getDatasetMeta(di).data.forEach((el, i) => { const t = ds.ptLabels[i]; if (!t) return; ctx.save(); ctx.font = '600 13px system-ui, "Noto Sans Thai", sans-serif'; const w = ctx.measureText(t).width + 8, h = 20;
  const cands = [[el.x + 10, el.y - h / 2], [el.x - 10 - w, el.y - h / 2], [el.x - w / 2, el.y - 12 - h], [el.x - w / 2, el.y + 12]];
  const fits = ([x, y]) => x >= A.left && x + w <= A.right && y >= A.top && y + h <= A.bottom && !placed.some(b => x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y);
  const [x, y] = cands.find(fits) || cands[0]; placed.push({ x, y, w, h });
  ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#1f2430'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x + 4, y + h / 2); ctx.restore(); }); }); } };

async function loadDashData() {
  const [places, bins, roads, msum] = await Promise.all([
    api.list('v_place', { eq: { status: 'active', ...scopeEq() } }),
    api.list('v_bin', { eq: { status: 'active', ...scopeEq() } }),
    api.list('v_road_summary', { eq: scopeEq() }),
    api.list('v_municipality_summary', { order: ['municipality_code'] })]);
  const placeIds = new Set(places.map(p => p.id));
  // ชำรุด/หาย ไม่นับทั้งใบและลิตร (DEC-089)
  return { places, bins: bins.filter(b => placeIds.has(b.place_id) && (b.condition || 'ปกติ') === 'ปกติ'), roads, msum: S.scopeMuni ? msum.filter(m => m.municipality_id === S.scopeMuni) : msum };
}
function dashTabs(cur) {
  return `<nav class="subtabs">${[['', 'ภาพรวม'], ['research', 'วิเคราะห์เชิงลึก'], ['assets', 'ทรัพย์สินถัง']].map(([k, l]) => `<a href="#dashboard${k ? '/' + k : ''}" class="${cur === k ? 'active' : ''}">${l}</a>`).join('')}</nav>`;
}
async function pageDashboard(view) {
  const sub = (location.hash.split('/')[1] || '').split('?')[0];
  if (sub === 'research') return pageDashResearch(view);
  if (sub === 'assets') return pageDashAssets(view);
  return pageDashOverview(view);
}

  const street = L.tileLayer((await tilesAvailable()) ? CONFIG.TILES.url : CONFIG.TILES_FALLBACK.url, { maxZoom: 19, attribution: (await tilesAvailable()) ? CONFIG.TILES.attribution : CONFIG.TILES_FALLBACK.attribution, referrerPolicy: 'origin' }).addTo(map);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri' });

  const g = L.featureGroup().addTo(map); const maxL = Math.max(1, ...places.map(p => +p.total_liters));

  if (g.getLayers().length) map.fitBounds(g.getBounds().pad(0.15)); else map.setView([CONFIG.MAP_FALLBACK.lat, CONFIG.MAP_FALLBACK.lng], CONFIG.MAP_FALLBACK.zoom);
  // แท่ง 100% ซ้อน 2 แถว
  mkChart($('#cStack'), { type: 'bar', data: { labels: ['จำนวนจุด', 'ความจุ'], datasets: byTier.map(x => ({ label: x.t.label, data: [pct(x.n, places.length), pct(x.liters, totL)], rawVals: [x.n, x.liters], backgroundColor: x.t.color, borderWidth: 0 })) },
    options: { indexAxis: 'y', maintainAspectRatio: false, scales: { x: { stacked: true, min: 0, max: 100, ticks: { callback: v => v + '%' } }, y: { stacked: true } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt1(c.raw)}% (${fmt(c.dataset.rawVals[c.dataIndex])} ${c.dataIndex ? 'ลิตร' : 'จุด'})` } } } } });
}

// ---------- หน้า 2 วิเคราะห์เชิงลึก ----------
async function pageDashResearch(view) {

  const typeOpts = S.cache.bin_type.map(t => ({ value: t.id, label: t.name })).filter(o => bins.some(b => b.bin_type_id === o.value));

    <div id="dashBody"></div>`;

    let ps = places.filter(p => (!fr.size || fr.has(p.road_id)) && (!fp.size || fp.has(p.place_type_id)));
    const pid = new Set(ps.map(p => p.id));
    const bs = bins.filter(b => pid.has(b.place_id) && (!ft.size || ft.has(b.bin_type_id)));
    if (ft.size) { const has = new Set(bs.map(b => b.place_id)); ps = ps.filter(p => has.has(p.id)); }   // กรองประเภทถัง → นับเฉพาะจุดที่มีถังประเภทนั้น และนับลิตรเฉพาะประเภทนั้น
    const agg = {}; for (const b of bs) { agg[b.place_id] = agg[b.place_id] || { bins: 0, liters: 0 }; agg[b.place_id].bins += +b.amount; agg[b.place_id].liters += +b.liters; }
    const rows = ps.map(p => ({ ...p, f_bins: (agg[p.id] || {}).bins || 0, f_liters: (agg[p.id] || {}).liters || 0 })).sort((a, b) => b.f_liters - a.f_liters);

    const roadArr = Object.values(byRoad).sort((a, b) => b.liters - a.liters);
    let cum = 0, heavy = 0; for (const r of roadArr) { if (cum < totL / 2) heavy++; cum += r.liters; }   // ถนนกลุ่มแรกที่รวมกันถือความจุเกินครึ่ง (ไม่ฟิกตัวเลขลิตร)

// DEC-092 สีเส้นทางตามความจุรวมของเส้นทาง: แบ่ง 5 ช่วงเท่ากันระหว่างเส้นทางที่น้อยสุดและมากสุดของเทศบาล (คำนวณสด ไม่ฟิกตัวเลข)
const ROUTE_RAMP = ['#9ccc65', '#ffca28', '#fb8c00', '#e53935', '#6a1b9a'];   // น้อย → มาก (เขียวอ่อน เหลือง ส้ม แดง ม่วง ชุดเดียวกับระดับจุด)
function routeBands(routes) {
  const vals = routes.map(r => +r.total_liters || 0); const lo = Math.min(...vals), hi = Math.max(...vals);
  const step = hi > lo ? (hi - lo) / ROUTE_RAMP.length : 0;
  const bandOf = v => (step === 0 ? ROUTE_RAMP.length - 1 : Math.min(ROUTE_RAMP.length - 1, Math.floor(((+v || 0) - lo) / step)));
  const legend = ROUTE_RAMP.map((c, i) => ({ color: c, from: Math.round(lo + step * i), to: i === ROUTE_RAMP.length - 1 ? Math.round(hi) : Math.round(lo + step * (i + 1)) }));
  return { colorOf: r => ROUTE_RAMP[bandOf(r.total_liters)], legend, single: step === 0 };
}

// A2 ผูกป้ายกับช่องกรอกอัตโนมัติ: label ที่ไม่มี for= และไม่ได้ครอบช่อง → ผูกกับช่องแรกที่ตามมา (ตั้ง id ให้ถ้ายังไม่มี) เพื่อโปรแกรมอ่านหน้าจอ

async function routeRoads(routeId) {

const nnOrder = pts => { const d = (a, b) => { const dx = (a.lng - b.lng) * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180), dy = a.lat - b.lat; return dx * dx + dy * dy; }; const rest = pts.filter(p => p.lat != null && p.lng != null).sort((a, b) => a.lng - b.lng); if (!rest.length) return []; const out = [rest.shift()]; while (rest.length) { const last = out[out.length - 1]; let bi = 0; for (let i = 1; i < rest.length; i++) if (d(last, rest[i]) < d(last, rest[bi])) bi = i; out.push(rest.splice(bi, 1)[0]); } return out.concat(pts.filter(p => p.lat == null || p.lng == null)); };

function superSettings() {
  const rows = S.cache.app_setting.slice().sort((a, b) => (SETTINGS_META[a.key] ? 0 : 1) - (SETTINGS_META[b.key] ? 0 : 1));
  const ctrl = r => { const m = SETTINGS_META[r.key] || { type: 'text', label: r.key };
    if (m.type === 'choice') return m.options.map(([v, l]) => `<label class="pick-opt"><input type="radio" name="st_${r.key}" value="${esc(v)}" ${String(r.value) === v ? 'checked' : ''}> ${esc(l)}</label>`).join('');
    if (m.type === 'number') return `<input type="number" step="any" inputmode="decimal" id="st_${r.key}" value="${esc(r.value ?? '')}" placeholder="${m.placeholder || ''}">`;
    if (m.type === 'tags') return `<input id="st_${r.key}" value="${esc(r.value ?? '')}"><div class="legend" style="margin-top:6px">${String(r.value || '').split(',').map(x => x.trim()).filter(Boolean).map(x => `<span class="pill">${esc(x)}</span>`).join('')}</div>`;
    return `<input id="st_${r.key}" value="${esc(r.value ?? '')}">`; };
  return `<div class="card"><h4 style="margin-top:0">ค่าตั้งค่าส่วนกลาง ${helpBtn('super-settings')}</h4><div class="muted">แต่ละค่ามีคำอธิบายผลกระทบ · กด "บันทึก" ทีละค่า · ค่าที่มีเครื่องหมาย ⚠ กระทบทุกเทศบาลทันที</div></div>
    ${rows.map(r => { const m = SETTINGS_META[r.key] || { label: r.key, effect: r.description || '' }; return `<div class="card"><div class="row" style="justify-content:space-between"><h4 style="margin:0">${m.danger ? '⚠ ' : ''}${esc(m.label)}</h4><span class="muted mono" style="font-size:12px">${esc(r.key)}</span></div><div class="muted" style="margin:4px 0 8px">${esc(m.effect)}</div>${ctrl(r)}<div class="row" style="margin-top:8px"><button class="small" onclick="saveSetting('${r.key}')">บันทึก</button><span class="muted">ค่าปัจจุบัน: ${esc(r.value || '(ว่าง)')}</span></div></div>`; }).join('')}`;
}
async function saveSetting(key) {
  const m = SETTINGS_META[key] || { type: 'text' };
  let v = m.type === 'choice' ? (document.querySelector(`input[name=st_${key}]:checked`) || {}).value : $('#st_' + key).value;
  if (v == null) return toast('เลือกค่าก่อน', true);
  v = String(v).trim();
  if (m.type === 'number' && v !== '' && isNaN(parseFloat(v))) return toast('ต้องเป็นตัวเลข', true);
  if (key === 'default_photo_endpoint_url' && v && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)) return toast('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/macros/s/ และลงท้ายด้วย /exec', true);
  if (m.danger && !confirm('ค่านี้กระทบทุกเทศบาลทันที ยืนยันบันทึก?')) return;
  try { await api.update('app_setting', key, { value: v }, 'key'); toast('บันทึกแล้ว'); S.cache.loaded = false; render(); } catch (e) { toast(e.message, true); }
}
// DEC-095 สคริปต์รับรูปสำหรับเทศบาล: เติมค่าสาธารณะจาก CONFIG ให้เสร็จ เทศบาลแค่วางแล้ว deploy
const PHOTO_SCRIPT_TEMPLATE = "/**\n * UBWast — สคริปต์รับรูป \"ฉบับย่อ\" สำหรับเทศบาลที่ต้องการเก็บรูปใน Google Drive ของตนเอง (DEC-080 วิธี ข · DEC-095)\n * ----------------------------------------------------------------------\n * วิธีใช้ (เทศบาลทำเอง ไม่ต้องตั้งค่าใด ๆ เพิ่ม):\n *   1. เข้า script.google.com ด้วยบัญชี Google ของเทศบาล → โครงการใหม่ (New project)\n *   2. ลบโค้ดเดิมในไฟล์ รหัส.gs (Code.gs) ให้ว่าง แล้ววางไฟล์นี้ทั้งหมด → บันทึก (Save)\n *   3. การทำให้ใช้งานได้ (Deploy) → การทำให้ใช้งานได้ใหม่ (New deployment) → ประเภท เว็บแอป (Web app)\n *      · ดำเนินการในฐานะ ฉัน (Execute as: Me) · ผู้มีสิทธิ์เข้าถึง ทุกคน (Who has access: Anyone) → ทำให้ใช้งานได้ (Deploy) → อนุญาต (Authorize)\n *   4. คัดลอก URL เว็บแอป (ลงท้าย /exec) ส่งให้ admin เทศบาล หรือเจ้าของโครงการ ไปใส่ในหน้า \"ตั้งค่าเทศบาล\"\n *\n * ค่า 2 ค่าด้านล่างเป็นค่าสาธารณะของโครงการ (เหมือนกันทุกเทศบาล · เจ้าของโครงการเติมให้แล้ว · ไม่ใช่ความลับ)\n * ไม่มีกุญแจลับใด ๆ ในสคริปต์นี้ · รับเฉพาะรูปจากผู้ที่ล็อกอินระบบ UBWast จริงเท่านั้น\n * รูปจะอยู่ในโฟลเดอร์ \"UBWast-photos/<รหัสเทศบาล>\" ใน Drive ของบัญชีที่ deploy (สร้างให้อัตโนมัติ)\n * ถ้าต้องการใช้โฟลเดอร์ที่สร้างเองให้ใส่รหัสโฟลเดอร์ใน PHOTO_FOLDER_ID (ไม่บังคับ)\n */\nvar SUPABASE_URL = '__SUPABASE_URL__';              // ที่อยู่ฐานข้อมูลของโครงการ\nvar SUPABASE_PUBLISHABLE_KEY = '__SUPABASE_KEY__';  // กุญแจสาธารณะ (sb_publishable_…) ค่าเดียวกับในหน้าเว็บ\nvar PHOTO_FOLDER_ID = '';                           // ไม่บังคับ: รหัสโฟลเดอร์ Drive (ตัวอักษรท้ายลิงก์โฟลเดอร์) ว่าง = สร้าง \"UBWast-photos\" ให้เอง\n\nvar VERSION = '0.2.0';\n// อ่านค่า: ใช้ค่าคงที่ด้านบนก่อน ถ้าว่างค่อยอ่านจาก Script properties (รองรับวิธีเดิม)\nfunction cfg_(key) { var c = { SUPABASE_URL: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY: SUPABASE_PUBLISHABLE_KEY, PHOTO_FOLDER_ID: PHOTO_FOLDER_ID }[key]; if (c && !/^__/.test(c)) return c; return PropertiesService.getScriptProperties().getProperty(key) || ''; }\n\n\nfunction doGet() { return json_({ ok: true, service: 'ubwast-photo-upload', version: VERSION }); }\n\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'คำขอไม่ใช่ JSON' }); }\n  try {\n    if (req.action !== 'upload_photo') return json_({ ok: false, error: 'สคริปต์นี้รับเฉพาะ upload_photo' });\n    verifyLogin_(req.token);\n    if (!req.data) throw new Error('ไม่มีข้อมูลรูป');\n    var root = folderByProp_('PHOTO_FOLDER_ID', 'UBWast-photos');\n    var sub = subFolder_(root, String(req.municipality_code || 'misc'));\n    var name = req.filename || (String(req.place_code || 'photo') + '_' + Utilities.formatDate(new Date(), 'Asia/Bangkok', 'yyyyMMdd_HHmmss') + '.jpg');\n    var blob = Utilities.newBlob(Utilities.base64Decode(req.data), req.mime || 'image/jpeg', name);\n    var file = sub.createFile(blob);\n    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n    return json_({ ok: true, file_id: file.getId(),\n                   url: 'https://drive.google.com/thumbnail?id=' + file.getId() + '&sz=w1000',\n                   view_url: 'https://drive.google.com/file/d/' + file.getId() + '/view',\n                   size: blob.getBytes().length });\n  } catch (err) {\n    return json_({ ok: false, error: String(err && err.message || err) });\n  }\n}\n\nfunction verifyLogin_(token) {\n  if (!token) throw new Error('ไม่ได้ล็อกอิน');\n  if (!cfg_('SUPABASE_URL') || !cfg_('SUPABASE_PUBLISHABLE_KEY')) throw new Error('สคริปต์ยังไม่มีค่า SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY (ขอสคริปต์ที่เติมค่าแล้วจากเจ้าของโครงการ)');\n  var res = UrlFetchApp.fetch(cfg_('SUPABASE_URL') + '/auth/v1/user', {\n    method: 'get', muteHttpExceptions: true,\n    headers: { apikey: cfg_('SUPABASE_PUBLISHABLE_KEY'), Authorization: 'Bearer ' + token }\n  });\n  if (res.getResponseCode() !== 200) throw new Error('ตัวตนไม่ถูกต้องหรือหมดอายุ กรุณาล็อกอินใหม่');\n}\nfunction folderByProp_(propKey, defaultName) {\n  var id = cfg_(propKey);\n  if (id) return DriveApp.getFolderById(id);\n  var it = DriveApp.getFoldersByName(defaultName);\n  var f = it.hasNext() ? it.next() : DriveApp.createFolder(defaultName);\n  PropertiesService.getScriptProperties().setProperty(propKey, f.getId());   // จำโฟลเดอร์ที่สร้างไว้ ครั้งต่อไปใช้เดิม\n  return f;\n}\nfunction subFolder_(parent, name) {\n  var it = parent.getFoldersByName(name);\n  return it.hasNext() ? it.next() : parent.createFolder(name);\n}\nfunction json_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }\n";
const photoScriptText = () => PHOTO_SCRIPT_TEMPLATE.replace('__SUPABASE_URL__', CONFIG.SUPABASE_URL).replace('__SUPABASE_KEY__', CONFIG.SUPABASE_PUBLISHABLE_KEY);
async function copyText(text, label) { try { await navigator.clipboard.writeText(text); toast(`คัดลอก${label}แล้ว`); } catch { openModal(`<h3 style="margin-top:0">${esc(label)}</h3><div class="muted">เบราว์เซอร์ไม่อนุญาตให้คัดลอกอัตโนมัติ เลือกข้อความด้านล่างแล้วกด Ctrl+C</div><textarea rows="14" style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea><button onclick="closeModal()">ปิด</button>`); } }
function downloadText(text, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })); a.download = filename; a.click(); }
const muniMessageText = (muniName) => `เรื่อง: ตั้งค่าที่เก็บรูปถ่ายของ${muniName || 'เทศบาล'}ในระบบข้อมูลจุดวางถังขยะ

ขอให้ผู้ดูแลบัญชี Google ของเทศบาล ทำ 4 ขั้นต่อไปนี้ (ใช้เวลาประมาณ 10 นาที ไม่ต้องตั้งค่าใด ๆ เพิ่ม):
1. เข้า script.google.com ด้วยบัญชี Google ของเทศบาล → กด "โครงการใหม่" (New project)
2. ลบโค้ดเดิมในไฟล์ รหัส.gs (Code.gs) ให้ว่าง แล้ววางโค้ดจากไฟล์แนบ Code.gs ทั้งหมด → กดบันทึก (Save)
3. กด "การทำให้ใช้งานได้" (Deploy) → "การทำให้ใช้งานได้ใหม่" (New deployment) → ประเภท "เว็บแอป" (Web app) → ดำเนินการในฐานะ "ฉัน" (Execute as: Me) → ผู้มีสิทธิ์เข้าถึง "ทุกคน" (Who has access: Anyone) → "ทำให้ใช้งานได้" (Deploy) → อนุญาตสิทธิ์ (Authorize access) ถ้า Google เตือนว่าแอปยังไม่ได้ยืนยัน ให้กด "ขั้นสูง" (Advanced) → "ไปที่ ..." (Go to ...)
4. คัดลอก "URL เว็บแอป" (ขึ้นต้น https://script.google.com/macros/s/ ลงท้าย /exec) แล้วส่งกลับมาให้เจ้าของโครงการ

function muniForm() {
  openModal(`<h3 style="margin-top:0">สร้างเทศบาลใหม่</h3><label for="mu_code">รหัสย่อ (a-z/0-9 2–12 ตัว ใช้ประกอบชื่อล็อกอิน เช่น npm)</label><input id="mu_code" autocapitalize="none" placeholder="npm"><label for="mu_name">ชื่อเทศบาล</label><input id="mu_name" maxlength="200" placeholder="เทศบาลเมืองนครพนม"><label for="mu_note">หมายเหตุ (ไม่บังคับ)</label><input id="mu_note">
    <div class="row" style="margin-top:12px"><button id="mu_save">สร้าง</button><button class="secondary" onclick="closeModal()">ยกเลิก</button></div><div class="muted">ระบบจะสร้างบัญชี admin 1 บัญชี และผู้บันทึก 3 บัญชี (รหัส-admin, รหัส-rec1, -rec2, -rec3) รหัสผ่านสุ่มและแสดงครั้งเดียวพร้อมปุ่มพิมพ์ใบส่งมอบ (DEC-093)</div>`);
  $('#mu_save').onclick = async () => {
    const b = $('#mu_save'); b.disabled = true; b.textContent = 'กำลังสร้าง…';
    const code = $('#mu_code').value.trim().toLowerCase(), name = $('#mu_name').value.trim();
    if (!/^[a-z0-9]{2,12}$/.test(code)) { toast('รหัสย่อต้องเป็น a-z หรือ 0-9 ยาว 2–12 ตัว', true); b.disabled = false; b.textContent = 'สร้าง'; return; }
    if (!name) { toast('กรอกชื่อเทศบาล', true); b.disabled = false; b.textContent = 'สร้าง'; return; }
    const accounts = []; let mid = null; const problems = [];
    try { const r = await api.engine('create_municipality', { code, name, note: $('#mu_note').value.trim() }); accounts.push(...r.accounts); mid = (r.municipality || {}).id; }
    catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'สร้าง'; return; }
    for (const i of [2, 3]) { b.textContent = `กำลังสร้างผู้บันทึก ${i}/3…`; try { const r = await api.engine('create_user', { username: `${code}-rec${i}`, display_name: `ผู้บันทึก ${i} ${name}`, role: 'recorder', municipality_id: mid }); accounts.push(r.account); } catch (e) { problems.push(`${code}-rec${i}: ${e.message}`); } }
    showCredentials(accounts, { municipality: name, code, problems });
  };
}

      <h2>รายการชำรุด/หาย (เพื่อซ่อมหรือของบทดแทน)</h2><table><thead><tr><th>รหัสจุด</th><th>จุด</th><th>ถนน</th><th>ประเภท</th><th class="r">ใบ</th><th>สภาพ</th><th class="r">ปีงบ</th><th class="r">มูลค่าซื้อ</th></tr></thead><tbody>${bad.map(x => `<tr><td>${esc(x.place_code)}</td><td>${esc(x.place_name)}</td><td>${esc(x.road_name)}</td><td>${esc(x.bin_type_name)}</td><td class="r">${fmt(x.amount)}</td><td>${esc(x.condition)}</td><td class="r">${x.fiscal_year || '-'}</td><td class="r">${x.priced ? fmt(Math.round(x.purchase_value)) : '-'}</td></tr>`).join('') || '<tr><td colspan="8">ไม่มีถังชำรุด/หาย</td></tr>'}</tbody></table>${rptSig()}`);
  }
  if (kind === 'gaps') {
    const roadsAll = await api.list('road', { eq: { municipality_id: mid, status: 'active' }, order: ['name'] });
    const used = new Set(places.map(p => p.road_id));
    const list = (title, arr, cols) => `<h2>${title} (${fmt(arr.length)})</h2>${arr.length ? `<table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${arr.map(x => `<tr>${cols.map(c => `<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<div class="note">ไม่มี</div>'}`;
    const pc = [['รหัสจุด', x => esc(x.place_code)], ['ชื่อ', x => esc(x.name)], ['ถนน', x => esc(x.road_name)], ['ผู้บันทึก', x => esc(x.created_by_name || '')], ['มอบหมายให้', () => ''], ['เสร็จ ✓', () => '']];
    return rptOpen(`${rptHeader('รายการจุดที่ยังขาดข้อมูล (สำหรับมอบหมายงานสำรวจ)', muni)}${list('จุดที่ยังไม่มีถัง', places.filter(p => +p.total_bins === 0), pc)}${list('จุดที่ยังไม่มีพิกัด', places.filter(p => p.lat == null), pc)}${list('จุดที่ยังไม่มีรูป', places.filter(p => +p.photo_count === 0), pc)}${list('ถนนที่ยังไม่มีจุดวางถัง', roadsAll.filter(r => !used.has(r.id)), [['ถนน', x => esc(x.name)], ['ประเภท', x => esc(x.road_type || '')], ['มอบหมายให้', () => ''], ['สำรวจแล้ว ✓', () => '']])}${rptSig()}`);
  }
}

// =====================================================================
// เริ่มทำงาน
// =====================================================================
Queue.refreshBadge();
render();
if (navigator.onLine) setTimeout(() => Queue.sync(), 3000);
</script>
